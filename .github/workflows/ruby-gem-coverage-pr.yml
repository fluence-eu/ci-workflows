name: Ruby Gem — Coverage PR Check

# Posts (or updates) a sticky coverage comment on a pull request,
# comparing the PR's coverage to the latest successful run on main.
# Fails if undercover flagged new uncovered code.
#
# Must be called by a job that depends on an upstream job of the
# SAME workflow run which uploaded a `coverage` artifact with the
# SimpleCov resultset + Undercover JSON files. Artifacts uploaded
# in the same run are visible to reusable workflows.
#
# The coverage_report.rb helper lives in this central repo at
# `.github/scripts/` and is fetched via a sidecar checkout.

on:
  workflow_call:
    inputs:
      ruby_version:
        description: Ruby version for the runner
        required: false
        type: string
        default: '4.0'
      workflow_file:
        description: Consumer workflow filename that uploaded the `coverage` artifact on main (used to find the baseline).
        required: false
        type: string
        default: 'main.yml'
      include_files:
        description: undercover --include-files glob (files considered for coverage).
        required: false
        type: string
        default: 'lib/**/*.rb'
      exclude_files:
        description: undercover --exclude-files glob (files ignored by coverage). Empty = no exclusion.
        required: false
        type: string
        default: ''
    secrets:
      FLUENCE_CI_BOT_PRIVATE_KEY:
        description: Private key of the read-only GitHub App used to checkout this central repo as a sidecar (to fetch `coverage_report.rb`).
        required: true

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate CI bot token (read-only access to ci-workflows)
        id: ci-bot-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.FLUENCE_CI_BOT_ID }}
          private-key: ${{ secrets.FLUENCE_CI_BOT_PRIVATE_KEY }}
          repositories: ci-workflows

      - name: Checkout ci-workflows (for coverage_report.rb)
        uses: actions/checkout@v6
        with:
          repository: fluence-eu/ci-workflows
          ref: v1
          path: _ci_workflows_
          token: ${{ steps.ci-bot-token.outputs.token }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler-cache: true

      - name: Download coverage artifact (this run)
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage/

      - name: Find latest base-branch run with coverage artifact
        id: base-run
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: ${{ inputs.workflow_file }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          RUN_ID=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/${WORKFLOW_FILE}/runs?branch=${BASE_REF}&status=success&per_page=1" \
            --jq '.workflow_runs[0].id // ""')
          echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download base coverage artifact
        if: steps.base-run.outputs.id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: coverage
          run-id: ${{ steps.base-run.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: coverage-base/

      - name: Check coverage
        id: coverage
        continue-on-error: true
        env:
          INCLUDE_FILES: ${{ inputs.include_files }}
          EXCLUDE_FILES: ${{ inputs.exclude_files }}
        run: |
          set -o pipefail
          EXCLUDE_ARG=""
          if [ -n "$EXCLUDE_FILES" ]; then
            EXCLUDE_ARG="--exclude-files $EXCLUDE_FILES"
          fi
          bundle exec undercover \
            --compare origin/${{ github.base_ref }} \
            --include-files "$INCLUDE_FILES" \
            $EXCLUDE_ARG \
            --simplecov coverage/coverage.json | tee /tmp/undercover.txt

      - name: Comment on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MARKER="<!-- coverage-report -->"
          BASE_RESULTSET=""
          if [ -f coverage-base/.resultset.json ]; then
            BASE_RESULTSET="coverage-base/.resultset.json"
          fi
          BODY="$(ruby _ci_workflows_/.github/scripts/coverage_report.rb \
                   "${{ steps.coverage.outcome }}" \
                   "origin/${{ github.base_ref }}" \
                   "coverage/.resultset.json" \
                   "$BASE_RESULTSET")"
          BODY="${MARKER}"$'\n'"${BODY}"

          PR=${{ github.event.pull_request.number }}
          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${PR}/comments" \
            --paginate --jq "[.[] | select(.body | startswith(\"${MARKER}\"))][0].id // \"\"")

          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" \
              -X PATCH -f body="$BODY"
          else
            gh api "repos/${{ github.repository }}/issues/${PR}/comments" \
              -f body="$BODY"
          fi

      - name: Fail if coverage check failed
        run: |
          [ "${{ steps.coverage.outcome }}" = "success" ]
