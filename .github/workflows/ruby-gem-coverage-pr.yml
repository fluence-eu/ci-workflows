name: Ruby Gem — Coverage PR Check

# Runs on pull requests. Delegates the PR-head measurement to
# ruby-gem-coverage-measure.yml (same reusable used by main-push
# baseline runs — zero duplication of the measure logic). Then
# fetches the latest baseline from a main-push `coverage-measure.yml`
# run, runs undercover against the baseline, posts a sticky PR
# comment with the diff, and fails if undercover flagged new
# uncovered code.
#
# Mirrors ruby-gem-docs-pr.yml's shape — the two workflows share the
# same measure/compare pattern and the same set of consumer thin
# callers.

on:
  workflow_call:
    inputs:
      measure_workflow_file:
        description: Consumer workflow filename that uploaded the `coverage` artifact on the base branch (used to find the baseline).
        required: false
        type: string
        default: 'coverage-measure.yml'
    secrets:
      FLUENCE_CI_BOT_PRIVATE_KEY:
        description: Optional GitHub App private key used to author the sticky PR comment. When omitted, the comment is posted as `github-actions[bot]` via the default `GITHUB_TOKEN`.
        required: false
      FLUENCE_RELEASE_BOT_PRIVATE_KEY:
        description: |
          Optional release App private key. When forwarded, release PRs
          (head_ref `release/v*` authored by the App) skip both measure
          and comment jobs — skipped jobs report as `neutral` and count
          as passing for required status checks, letting auto-merge
          proceed. When omitted, all PRs run normally.
        required: false

permissions:
  contents: read
  packages: read

jobs:
  resolve-bot:
    name: Resolve release-bot
    runs-on: ubuntu-latest
    outputs:
      skip_release_pr: ${{ steps.check.outputs.skip }}
    steps:
      - id: token
        uses: fluence-eu/ci-workflows/actions/release-app-token@v6
        with:
          client-id: ${{ vars.FLUENCE_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLUENCE_RELEASE_BOT_PRIVATE_KEY }}
      - id: check
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          SLUG: ${{ steps.token.outputs.app-slug }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Skip when both conditions hold: PR author is the release App
          # AND head ref starts with `release/v`. SLUG is empty when the
          # consumer didn't forward FLUENCE_RELEASE_BOT_PRIVATE_KEY — the empty
          # match makes skip false, preserving the prior always-run
          # behaviour.
          if [ -n "$SLUG" ] && [ "$AUTHOR" = "${SLUG}[bot]" ] && [[ "$HEAD_REF" == release/v* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release PR detected — skipping measure + comment."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  measure:
    name: Measure
    needs: resolve-bot
    if: needs.resolve-bot.outputs.skip_release_pr == 'false'
    uses: fluence-eu/ci-workflows/.github/workflows/ruby-gem-coverage-measure.yml@v6

  comment:
    name: Comment on PR
    needs: [resolve-bot, measure]
    if: needs.resolve-bot.outputs.skip_release_pr == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read .fluence-ci.yml
        id: cfg
        uses: fluence-eu/ci-workflows/actions/read-config@v6
        with:
          keys: |
            include_files=coverage.include_files=lib/**/*.rb
            exclude_files=coverage.exclude_files=

      - name: Resolve Ruby version
        id: ruby
        uses: fluence-eu/ci-workflows/actions/resolve-version@v6
        with:
          runtime: ruby

      - uses: ruby/setup-ruby@v1
        env:
          # Authenticate `bundle install` (triggered by bundler-cache: true)
          # against GitHub Packages so private Fluence gems (e.g.
          # fluence-ci-tools) can be fetched. The job declares
          # `permissions: packages: read` to grant the GITHUB_TOKEN the
          # required scope; the env var hands it to Bundler.
          BUNDLE_RUBYGEMS__PKG__GITHUB__COM: x-access-token:${{ secrets.GITHUB_TOKEN }}
        with:
          ruby-version: ${{ steps.ruby.outputs.version }}
          bundler-cache: true

      - name: Download PR coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage/

      - name: Find latest base-branch run with coverage artifact
        id: base-run
        uses: fluence-eu/ci-workflows/actions/find-base-run@v6
        with:
          workflow_file: ${{ inputs.measure_workflow_file }}

      - name: Download base coverage artifact
        if: steps.base-run.outputs.id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: coverage
          run-id: ${{ steps.base-run.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: coverage-base/

      - name: Run undercover
        id: coverage
        continue-on-error: true
        env:
          INCLUDE_FILES: ${{ fromJSON(steps.cfg.outputs.values).include_files }}
          EXCLUDE_FILES: ${{ fromJSON(steps.cfg.outputs.values).exclude_files }}
        run: |
          set -o pipefail
          EXCLUDE_ARG=""
          if [ -n "$EXCLUDE_FILES" ]; then
            EXCLUDE_ARG="--exclude-files $EXCLUDE_FILES"
          fi
          bundle exec undercover \
            --compare origin/${{ github.base_ref }} \
            --include-files "$INCLUDE_FILES" \
            $EXCLUDE_ARG \
            --simplecov coverage/coverage.json

      - name: Resolve baseline path
        id: base
        run: |
          if [ -f coverage-base/.resultset.json ]; then
            echo "path=coverage-base/.resultset.json" >> "$GITHUB_OUTPUT"
          fi

      - id: body
        uses: fluence-eu/ci-workflows/actions/coverage-report@v6
        with:
          outcome:   ${{ steps.coverage.outcome }}
          base_ref:  origin/${{ github.base_ref }}
          pr_path:   coverage/.resultset.json
          base_path: ${{ steps.base.outputs.path }}

      - uses: fluence-eu/ci-workflows/actions/post-sticky-comment@v6
        with:
          marker:          '<!-- coverage-report -->'
          body:            ${{ steps.body.outputs.body }}
          client-id:       ${{ vars.FLUENCE_CI_BOT_CLIENT_ID }}
          app-private-key: ${{ secrets.FLUENCE_CI_BOT_PRIVATE_KEY }}

      - name: Fail if coverage check failed
        run: |
          [ "${{ steps.coverage.outcome }}" = "success" ]
