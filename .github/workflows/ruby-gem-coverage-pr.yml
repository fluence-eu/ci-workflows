name: Ruby Gem — Coverage PR Check

# Runs on pull requests. Delegates the PR-head measurement to
# ruby-gem-coverage-measure.yml (same reusable used by main-push
# baseline runs — zero duplication of the measure logic). Then
# fetches the latest baseline from a main-push `coverage-measure.yml`
# run, runs undercover against the baseline, posts a sticky PR
# comment with the diff, and fails if undercover flagged new
# uncovered code.
#
# Mirrors ruby-gem-docs-pr.yml's shape — the two workflows share the
# same measure/compare pattern and the same set of consumer thin
# callers.

on:
  workflow_call:
    inputs:
      ruby_version:
        description: Ruby version for the runner
        required: false
        type: string
        default: '4.0'
      rake_task:
        description: Rake task to run for coverage generation (e.g. `spec` for rspec-based gems, `test` for minitest-based gems). Forwarded to ruby-gem-coverage-measure.yml.
        required: false
        type: string
        default: 'spec'
      measure_workflow_file:
        description: Consumer workflow filename that uploaded the `coverage` artifact on the base branch (used to find the baseline).
        required: false
        type: string
        default: 'coverage-measure.yml'
      include_files:
        description: undercover --include-files glob (files considered for coverage).
        required: false
        type: string
        default: 'lib/**/*.rb'
      exclude_files:
        description: undercover --exclude-files glob (files ignored by coverage). Empty = no exclusion.
        required: false
        type: string
        default: ''
    secrets:
      FLUENCE_CI_BOT_PRIVATE_KEY:
        description: Optional GitHub App private key used to author the sticky PR comment. When omitted, the comment is posted as `github-actions[bot]` via the default `GITHUB_TOKEN`.
        required: false

permissions:
  contents: read

jobs:
  measure:
    name: Measure
    uses: fluence-eu/ci-workflows/.github/workflows/ruby-gem-coverage-measure.yml@v2
    with:
      ruby_version: ${{ inputs.ruby_version }}
      rake_task: ${{ inputs.rake_task }}

  comment:
    name: Comment on PR
    needs: measure
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler-cache: true

      - name: Download PR coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage/

      - name: Find latest base-branch run with coverage artifact
        id: base-run
        uses: fluence-eu/ci-workflows/actions/find-base-run@v2
        with:
          workflow_file: ${{ inputs.measure_workflow_file }}

      - name: Download base coverage artifact
        if: steps.base-run.outputs.id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: coverage
          run-id: ${{ steps.base-run.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: coverage-base/

      - name: Run undercover
        id: coverage
        continue-on-error: true
        env:
          INCLUDE_FILES: ${{ inputs.include_files }}
          EXCLUDE_FILES: ${{ inputs.exclude_files }}
        run: |
          set -o pipefail
          EXCLUDE_ARG=""
          if [ -n "$EXCLUDE_FILES" ]; then
            EXCLUDE_ARG="--exclude-files $EXCLUDE_FILES"
          fi
          bundle exec undercover \
            --compare origin/${{ github.base_ref }} \
            --include-files "$INCLUDE_FILES" \
            $EXCLUDE_ARG \
            --simplecov coverage/coverage.json

      - name: Resolve baseline path
        id: base
        run: |
          if [ -f coverage-base/.resultset.json ]; then
            echo "path=coverage-base/.resultset.json" >> "$GITHUB_OUTPUT"
          fi

      - id: body
        uses: fluence-eu/ci-workflows/actions/coverage-report@v2
        with:
          outcome:   ${{ steps.coverage.outcome }}
          base_ref:  origin/${{ github.base_ref }}
          pr_path:   coverage/.resultset.json
          base_path: ${{ steps.base.outputs.path }}

      - uses: fluence-eu/ci-workflows/actions/post-sticky-comment@v2
        with:
          marker:          '<!-- coverage-report -->'
          body:            ${{ steps.body.outputs.body }}
          app-id:          ${{ vars.FLUENCE_CI_BOT_ID }}
          app-private-key: ${{ secrets.FLUENCE_CI_BOT_PRIVATE_KEY }}

      - name: Fail if coverage check failed
        run: |
          [ "${{ steps.coverage.outcome }}" = "success" ]
