name: Ruby Gem — Coverage PR Check

# Runs on pull requests. Delegates the PR-head measurement to
# ruby-gem-coverage-measure.yml (same reusable used by main-push
# baseline runs — zero duplication of the measure logic). Then
# fetches the latest baseline from a main-push `coverage-measure.yml`
# run, runs undercover against the baseline, posts a sticky PR
# comment with the diff, and fails if undercover flagged new
# uncovered code.
#
# Mirrors ruby-gem-docs-pr.yml's shape — the two workflows share the
# same measure/compare pattern and the same set of consumer thin
# callers.

on:
  workflow_call:
    inputs:
      ruby_version:
        description: Ruby version for the runner
        required: false
        type: string
        default: '4.0'
      measure_workflow_file:
        description: Consumer workflow filename that uploaded the `coverage` artifact on the base branch (used to find the baseline).
        required: false
        type: string
        default: 'coverage-measure.yml'
      include_files:
        description: undercover --include-files glob (files considered for coverage).
        required: false
        type: string
        default: 'lib/**/*.rb'
      exclude_files:
        description: undercover --exclude-files glob (files ignored by coverage). Empty = no exclusion.
        required: false
        type: string
        default: ''
    secrets:
      FLUENCE_CI_BOT_PRIVATE_KEY:
        description: Private key of the read-only GitHub App used to checkout this central repo as a sidecar (to fetch `coverage_report.rb`).
        required: true

permissions:
  contents: read

jobs:
  measure:
    name: Measure
    uses: fluence-eu/ci-workflows/.github/workflows/ruby-gem-coverage-measure.yml@v1
    with:
      ruby_version: ${{ inputs.ruby_version }}

  comment:
    name: Comment on PR
    needs: measure
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate CI bot token (read-only access to ci-workflows)
        id: ci-bot-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.FLUENCE_CI_BOT_ID }}
          private-key: ${{ secrets.FLUENCE_CI_BOT_PRIVATE_KEY }}
          repositories: ci-workflows

      - name: Checkout ci-workflows (for coverage_report.rb)
        uses: actions/checkout@v6
        with:
          repository: fluence-eu/ci-workflows
          ref: v1
          path: _ci_workflows_
          token: ${{ steps.ci-bot-token.outputs.token }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler-cache: true

      - name: Download PR coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage/

      - name: Find latest base-branch run with coverage artifact
        id: base-run
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: ${{ inputs.measure_workflow_file }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # `status=success` is silently ignored by the runs endpoint
          # (success is a conclusion, not a status). Query completed
          # runs and filter by .conclusion in jq.
          RUN_ID=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/${WORKFLOW_FILE}/runs?branch=${BASE_REF}&status=completed&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id // ""')
          echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download base coverage artifact
        if: steps.base-run.outputs.id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: coverage
          run-id: ${{ steps.base-run.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: coverage-base/

      - name: Run undercover
        id: coverage
        continue-on-error: true
        env:
          INCLUDE_FILES: ${{ inputs.include_files }}
          EXCLUDE_FILES: ${{ inputs.exclude_files }}
        run: |
          set -o pipefail
          EXCLUDE_ARG=""
          if [ -n "$EXCLUDE_FILES" ]; then
            EXCLUDE_ARG="--exclude-files $EXCLUDE_FILES"
          fi
          bundle exec undercover \
            --compare origin/${{ github.base_ref }} \
            --include-files "$INCLUDE_FILES" \
            $EXCLUDE_ARG \
            --simplecov coverage/coverage.json

      - name: Comment on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MARKER="<!-- coverage-report -->"
          BASE_RESULTSET=""
          if [ -f coverage-base/.resultset.json ]; then
            BASE_RESULTSET="coverage-base/.resultset.json"
          fi
          BODY="$(ruby _ci_workflows_/.github/scripts/coverage_report.rb \
                   "${{ steps.coverage.outcome }}" \
                   "origin/${{ github.base_ref }}" \
                   "coverage/.resultset.json" \
                   "$BASE_RESULTSET")"
          BODY="${MARKER}"$'\n'"${BODY}"

          PR=${{ github.event.pull_request.number }}
          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${PR}/comments" \
            --paginate --jq "[.[] | select(.body | startswith(\"${MARKER}\"))][0].id // \"\"")

          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" \
              -X PATCH -f body="$BODY"
          else
            gh api "repos/${{ github.repository }}/issues/${PR}/comments" \
              -f body="$BODY"
          fi

      - name: Fail if coverage check failed
        run: |
          [ "${{ steps.coverage.outcome }}" = "success" ]
