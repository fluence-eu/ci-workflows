name: Vue App — ESLint PR Check

# Runs on pull requests. Delegates the PR-head measurement to
# vue-app-eslint-measure.yml (same reusable used by main-push baseline
# runs — zero duplication of the measure logic). Then fetches the
# latest baseline from the consumer's eslint-measure.yml run, posts
# a sticky PR comment with the before/after offense count diff, and
# fails if eslint exited non-zero on the PR head.

on:
  workflow_call:
    inputs:
      measure_workflow_file:
        description: Consumer workflow filename that uploaded the `eslint-report` artifact on the base branch.
        required: false
        type: string
        default: 'eslint-measure.yml'
    secrets:
      FLUENCE_CI_BOT_PRIVATE_KEY:
        description: Optional GitHub App private key for the sticky PR comment author.
        required: false
      FLUENCE_RELEASE_BOT_PRIVATE_KEY:
        description: Optional release App key — release PRs (head_ref release/v* authored by the App) skip measure + comment when forwarded.
        required: false
      NPMRC_AUTH:
        description: |
          Multi-line .npmrc content forwarded to the measure reusable for private npm registry auth. See `vue-app-eslint-measure.yml` for the full format.
        required: false

permissions:
  contents: read
  packages: read

jobs:
  resolve-bot:
    name: Resolve release-bot
    runs-on: ubuntu-latest
    outputs:
      skip_release_pr: ${{ steps.check.outputs.skip }}
    steps:
      - id: token
        uses: fluence-eu/ci-workflows/actions/release-app-token@v6
        with:
          client-id: ${{ vars.FLUENCE_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLUENCE_RELEASE_BOT_PRIVATE_KEY }}
      - id: check
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          SLUG: ${{ steps.token.outputs.app-slug }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -n "$SLUG" ] && [ "$AUTHOR" = "${SLUG}[bot]" ] && [[ "$HEAD_REF" == release/v* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release PR detected — skipping measure + comment."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  measure:
    name: Measure
    needs: resolve-bot
    if: needs.resolve-bot.outputs.skip_release_pr == 'false'
    uses: fluence-eu/ci-workflows/.github/workflows/vue-app-eslint-measure.yml@v6
    secrets:
      NPMRC_AUTH: ${{ secrets.NPMRC_AUTH }}

  comment:
    name: Comment on PR
    needs: [resolve-bot, measure]
    if: needs.resolve-bot.outputs.skip_release_pr == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download PR eslint report
        uses: actions/download-artifact@v8
        with:
          name: eslint-report
          path: eslint-pr/

      - name: Find latest base-branch run with eslint report
        id: base-run
        uses: fluence-eu/ci-workflows/actions/find-base-run@v6
        with:
          workflow_file: ${{ inputs.measure_workflow_file }}

      - name: Download base eslint report
        if: steps.base-run.outputs.id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: eslint-report
          run-id: ${{ steps.base-run.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: eslint-base/

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'

      - name: Resolve baseline path
        id: base
        run: |
          if [ -f eslint-base/eslint.json ]; then
            echo "path=eslint-base/eslint.json" >> "$GITHUB_OUTPUT"
          fi

      - id: body
        uses: fluence-eu/ci-workflows/actions/eslint-report@v6
        with:
          outcome:   ${{ needs.measure.outputs.eslint_outcome }}
          base_ref:  origin/${{ github.base_ref }}
          pr_path:   eslint-pr/eslint.json
          base_path: ${{ steps.base.outputs.path }}

      - uses: fluence-eu/ci-workflows/actions/post-sticky-comment@v6
        with:
          marker:          '<!-- eslint-report -->'
          body:            ${{ steps.body.outputs.body }}
          client-id:       ${{ vars.FLUENCE_CI_BOT_CLIENT_ID }}
          app-private-key: ${{ secrets.FLUENCE_CI_BOT_PRIVATE_KEY }}

      - name: Fail if eslint failed
        run: |
          [ "${{ needs.measure.outputs.eslint_outcome }}" = "success" ]
