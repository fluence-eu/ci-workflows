name: Deps Merge

on:
  workflow_call:
    secrets:
      FLUENCE_DEPS_BOT_PRIVATE_KEY:
        description: Private key of the fluence-deps App, which merges the PR under its ruleset bypass.
        required: true

permissions:
  contents: read

jobs:
  merge:
    name: Merge
    if: github.event.issue.pull_request && github.event.issue.user.login == 'fluence-deps[bot]' && github.event.comment.body == '/merge'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read .fluence-ci.yml
        id: cfg
        uses: fluence-eu/ci-workflows/actions/read-config@v6
        with:
          keys: |
            mergers=deps.mergers

      - name: Authorize commenter
        env:
          MERGERS: ${{ fromJSON(steps.cfg.outputs.values).mergers }}
          COMMENTER_ID: ${{ github.event.comment.user.id }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          for id in $MERGERS; do
            if [ "$id" = "$COMMENTER_ID" ]; then exit 0; fi
          done
          echo "::error::$COMMENTER ($COMMENTER_ID) is not listed in .fluence-ci.yml deps.mergers"
          exit 1

      - name: Generate fluence-deps token
        id: token
        uses: fluence-eu/ci-workflows/actions/release-app-token@v6
        with:
          client-id: ${{ vars.FLUENCE_DEPS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLUENCE_DEPS_BOT_PRIVATE_KEY }}

      - name: Read head commit
        id: head
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ github.event.issue.number }}
        run: |
          sha=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Wait for PR checks
        id: wait
        uses: fluence-eu/ci-workflows/actions/deps-wait-checks@v6
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        with:
          pr: ${{ github.event.issue.number }}
          label: merge
          base_branch: ${{ github.event.repository.default_branch }}

      - name: Merge
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ github.event.issue.number }}
          STATE: ${{ steps.wait.outputs.state }}
          SHA: ${{ steps.head.outputs.sha }}
        run: |
          if [ "$STATE" != pass ]; then
            echo "::error::checks of #$PR ended in state $STATE"
            exit 1
          fi
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge --admin --match-head-commit "$SHA"
