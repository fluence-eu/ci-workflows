name: App — Release

# Triggered by consumer via push to the working branch (default
# `develop`) with a paths filter on CHANGELOG.md. Verifies the
# commit was authored by the release bot, extracts the tag from
# the "release: vX" commit message, creates the tag + GitHub
# Release, then force-pushes the working branch onto the released
# branch so it mirrors the latest release state.
#
# Companion to app-prepare-release.yml: that workflow auto-merges
# a "release: vX" commit touching CHANGELOG.md, which is what
# fires this workflow.
#
# Pattern target: rolling-release apps. The final `git push
# develop:main --force` is intentional — `main` is treated as a
# read-only mirror of the released snapshot, not a contributing
# branch. Any direct commit to `main` will be overwritten on the
# next release.

on:
  workflow_call:
    secrets:
      FLUENCE_RELEASE_BOT_PRIVATE_KEY:
        description: Private key of the GitHub App used to verify the release author and push the main mirror.
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - id: app-token
        uses: fluence-eu/ci-workflows/actions/release-app-token@v7
        with:
          client-id: ${{ vars.FLUENCE_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLUENCE_RELEASE_BOT_PRIVATE_KEY }}

      - id: verify
        uses: fluence-eu/ci-workflows/actions/verify-release-author@v7
        with:
          app-slug: ${{ steps.app-token.outputs.app-slug }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Checks out the pushed commit's ref — the consumer triggers this
      # on push to its working branch, which is also where
      # .fluence-ci.yml is read.
      - uses: actions/checkout@v7
        if: steps.verify.outputs.is_release == 'true'
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Read .fluence-ci.yml
        id: cfg
        if: steps.verify.outputs.is_release == 'true'
        uses: fluence-eu/ci-workflows/actions/read-config@v7
        with:
          keys: |
            develop_branch=release.develop_branch=develop
            main_branch=release.main_branch=main

      - uses: fluence-eu/ci-workflows/actions/setup-release-bot-git@v7
        if: steps.verify.outputs.is_release == 'true'
        with:
          app-token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      - name: Extract tag from commit message
        if: steps.verify.outputs.is_release == 'true'
        id: version
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          TAG=$(printf '%s' "$MSG" | grep -oE 'v[0-9][0-9.]*' | head -1)
          if [ -z "$TAG" ]; then
            echo "::error::No valid tag found in commit message"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: fluence-eu/ci-workflows/actions/tag-and-release@v7
        if: steps.verify.outputs.is_release == 'true'
        with:
          tag: ${{ steps.version.outputs.tag }}
          notes-source: changelog
          changelog-path: CHANGELOG.md
          app-token: ${{ steps.app-token.outputs.token }}

      - name: Mirror released branch
        if: steps.verify.outputs.is_release == 'true'
        env:
          DEVELOP: ${{ fromJSON(steps.cfg.outputs.values).develop_branch }}
          MAIN: ${{ fromJSON(steps.cfg.outputs.values).main_branch }}
        run: git push origin "$DEVELOP":"$MAIN" --force
