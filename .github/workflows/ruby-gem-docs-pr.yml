name: Ruby Gem — Docs PR Check

# Self-contained PR check for Ruby gem docs. Runs on pull requests.
#
# Two jobs:
#   measure — runs yardstick on the PR head, verifies against the
#             threshold (soft, so a failure doesn't kill the run
#             before the comment is posted), measures the base
#             branch in a sidecar checkout for the before/after
#             diff, and uploads both reports as intra-run artifacts.
#   comment — downloads both reports, builds the sticky PR comment
#             via yardstick_report.rb (fetched from this repo),
#             posts or updates it, and fails the run if the PR's
#             verify step failed.
#
# No cross-workflow artifact dependency: docs-deploy does only the
# Pages deployment, and does NOT upload any yardstick artifact.
#
# The yardstick_report.rb helper lives in this central repo at
# .github/scripts/ and is fetched via a sidecar checkout.

on:
  workflow_call:
    inputs:
      ruby_version:
        description: Ruby version for the runner
        required: false
        type: string
        default: '4.0'

permissions:
  contents: read

jobs:
  measure:
    name: Measure & verify
    runs-on: ubuntu-latest
    outputs:
      verify_outcome: ${{ steps.verify.outcome }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler-cache: true

      - name: Measure PR (yardstick)
        run: bundle exec rake doc:measure

      - name: Save PR yardstick report
        run: cp doc/yardstick_report.txt /tmp/yardstick_pr.txt

      - name: Verify PR threshold (soft — drives the comment)
        id: verify
        continue-on-error: true
        run: bundle exec rake doc:verify

      - name: Checkout base branch (for baseline)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.base_ref }}
          path: _base_
          fetch-depth: 1

      - name: Measure base branch (yardstick)
        working-directory: _base_
        run: |
          # bundler-cache above only installs the PR's gems; install
          # the base branch's gems here.
          bundle install --quiet
          bundle exec rake doc:measure
          cp doc/yardstick_report.txt /tmp/yardstick_base.txt

      - name: Upload PR yardstick report
        uses: actions/upload-artifact@v7
        with:
          name: yardstick-pr
          path: /tmp/yardstick_pr.txt

      - name: Upload base yardstick report
        uses: actions/upload-artifact@v7
        with:
          name: yardstick-base
          path: /tmp/yardstick_base.txt

  comment:
    name: Comment on PR
    needs: measure
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout ci-workflows (for yardstick_report.rb)
        uses: actions/checkout@v6
        with:
          repository: fluence-eu/ci-workflows
          ref: v1
          path: _ci_workflows_

      - name: Download PR yardstick report
        uses: actions/download-artifact@v8
        with:
          name: yardstick-pr
          path: yardstick-pr/

      - name: Download base yardstick report
        uses: actions/download-artifact@v8
        with:
          name: yardstick-base
          path: yardstick-base/

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler-cache: true

      - name: Build comment body
        id: body
        env:
          # Used by the script to render GitHub blob links pointing at
          # the PR head SHA, so each violation row is one-click-navigable.
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BODY="$(ruby _ci_workflows_/.github/scripts/yardstick_report.rb \
                   "${{ needs.measure.outputs.verify_outcome }}" \
                   "origin/${{ github.base_ref }}" \
                   "yardstick-pr/yardstick_pr.txt" \
                   "yardstick-base/yardstick_base.txt")"

          {
            echo "body<<EOF"
            echo "<!-- yardstick-report -->"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ steps.body.outputs.body }}
        run: |
          MARKER="<!-- yardstick-report -->"
          PR=${{ github.event.pull_request.number }}
          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${PR}/comments" \
            --paginate --jq "[.[] | select(.body | startswith(\"${MARKER}\"))][0].id // \"\"")

          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" \
              -X PATCH -f body="$BODY"
          else
            gh api "repos/${{ github.repository }}/issues/${PR}/comments" \
              -f body="$BODY"
          fi

      - name: Fail if yardstick verify failed
        run: |
          [ "${{ needs.measure.outputs.verify_outcome }}" = "success" ]
