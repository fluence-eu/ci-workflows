name: Ruby Gem — Docs PR Check

# Self-contained PR check for Ruby gem docs. Runs on pull requests.
#
# Measures the PR head, measures the base branch (checked out in a
# sidecar) for a before/after diff, runs yardstick verify on the PR,
# and posts (or updates) a sticky comment. Fails if verify failed on
# the PR — so merging cannot silently degrade doc coverage.
#
# No cross-workflow artifact dependency: docs-deploy is responsible
# only for deploying GitHub Pages and does not need to upload a
# yardstick baseline. The baseline is produced here, from the live
# base branch, at every PR run.
#
# The yardstick_report.rb helper lives in this central repo at
# .github/scripts/ and is fetched via a sidecar checkout.

on:
  workflow_call:
    inputs:
      ruby_version:
        description: Ruby version for the runner
        required: false
        type: string
        default: '4.0'

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    name: Comment on PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout base branch (for baseline)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.base_ref }}
          path: _base_
          fetch-depth: 1

      - name: Checkout ci-workflows (for yardstick_report.rb)
        uses: actions/checkout@v6
        with:
          repository: fluence-eu/ci-workflows
          ref: v1
          path: _ci_workflows_

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler-cache: true

      - name: Measure PR (yardstick)
        run: bundle exec rake doc:measure

      - name: Save PR yardstick report
        run: cp doc/yardstick_report.txt /tmp/yardstick_pr.txt

      - name: Verify PR threshold (soft — drives the comment)
        id: verify
        continue-on-error: true
        run: bundle exec rake doc:verify

      - name: Measure base branch (yardstick)
        working-directory: _base_
        run: |
          # bundler-cache above only installs the PR's gems; install
          # the base branch's gems here.
          bundle install --quiet
          bundle exec rake doc:measure
          cp doc/yardstick_report.txt /tmp/yardstick_base.txt

      - name: Build comment body
        id: body
        env:
          # Used by the script to render GitHub blob links pointing at
          # the PR head SHA, so each violation row is one-click-navigable.
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BODY="$(ruby _ci_workflows_/.github/scripts/yardstick_report.rb \
                   "${{ steps.verify.outcome }}" \
                   "origin/${{ github.base_ref }}" \
                   "/tmp/yardstick_pr.txt" \
                   "/tmp/yardstick_base.txt")"

          {
            echo "body<<EOF"
            echo "<!-- yardstick-report -->"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ steps.body.outputs.body }}
        run: |
          MARKER="<!-- yardstick-report -->"
          PR=${{ github.event.pull_request.number }}
          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${PR}/comments" \
            --paginate --jq "[.[] | select(.body | startswith(\"${MARKER}\"))][0].id // \"\"")

          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" \
              -X PATCH -f body="$BODY"
          else
            gh api "repos/${{ github.repository }}/issues/${PR}/comments" \
              -f body="$BODY"
          fi

      - name: Fail if yardstick verify failed
        run: |
          [ "${{ steps.verify.outcome }}" = "success" ]
