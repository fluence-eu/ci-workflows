name: Ruby Gem — Docs PR Check

# Runs on pull requests. Delegates the PR-head measurement to
# ruby-gem-docs-measure.yml (same reusable used by main-push baseline
# runs — zero duplication of the measure logic). Then fetches the
# latest baseline from a main-push `docs-measure.yml` run, posts a
# sticky PR comment with the before/after diff, and fails if the
# PR's yardstick verify step failed.
#
# Same baseline pattern as ruby-gem-coverage-pr.yml: the baseline
# artifact is produced by a dedicated sibling workflow (docs-measure)
# on push to main, fetched here via the workflow runs API.

on:
  workflow_call:
    inputs:
      ruby_version:
        description: Ruby version for the runner
        required: false
        type: string
        default: '4.0'
      measure_workflow_file:
        description: Consumer workflow filename that uploaded the `yardstick-report` artifact on the base branch (used to find the baseline).
        required: false
        type: string
        default: 'docs-measure.yml'
    secrets:
      FLUENCE_CI_BOT_PRIVATE_KEY:
        description: Private key of the read-only GitHub App used to checkout this central repo as a sidecar (to fetch `yardstick_report.rb`).
        required: true

permissions:
  contents: read

jobs:
  measure:
    name: Measure & verify
    uses: fluence-eu/ci-workflows/.github/workflows/ruby-gem-docs-measure.yml@v1
    with:
      ruby_version: ${{ inputs.ruby_version }}

  comment:
    name: Comment on PR
    needs: measure
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate CI bot token (read-only access to ci-workflows)
        id: ci-bot-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.FLUENCE_CI_BOT_ID }}
          private-key: ${{ secrets.FLUENCE_CI_BOT_PRIVATE_KEY }}
          repositories: ci-workflows

      - name: Checkout ci-workflows (for yardstick_report.rb)
        uses: actions/checkout@v6
        with:
          repository: fluence-eu/ci-workflows
          ref: v1
          path: _ci_workflows_
          token: ${{ steps.ci-bot-token.outputs.token }}

      - name: Download PR yardstick report
        uses: actions/download-artifact@v8
        with:
          name: yardstick-report
          path: yardstick-pr/

      - name: Find latest base-branch run with yardstick report
        id: base-run
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: ${{ inputs.measure_workflow_file }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # `status=success` is silently ignored by the runs endpoint
          # (success is a conclusion, not a status). Query completed
          # runs and filter by .conclusion in jq.
          RUN_ID=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/${WORKFLOW_FILE}/runs?branch=${BASE_REF}&status=completed&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id // ""')
          echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download base yardstick report
        if: steps.base-run.outputs.id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: yardstick-report
          run-id: ${{ steps.base-run.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: yardstick-base/

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler-cache: true

      - name: Build comment body
        id: body
        env:
          # Used by the script to render GitHub blob links pointing at
          # the PR head SHA, so each violation row is one-click-navigable.
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          PR_REPORT="yardstick-pr/yardstick_report.txt"
          BASE_REPORT=""
          if [ -f yardstick-base/yardstick_report.txt ]; then
            BASE_REPORT="yardstick-base/yardstick_report.txt"
          fi

          BODY="$(ruby _ci_workflows_/.github/scripts/yardstick_report.rb \
                   "${{ needs.measure.outputs.verify_outcome }}" \
                   "origin/${{ github.base_ref }}" \
                   "$PR_REPORT" "$BASE_REPORT")"

          {
            echo "body<<EOF"
            echo "<!-- yardstick-report -->"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ steps.body.outputs.body }}
        run: |
          MARKER="<!-- yardstick-report -->"
          PR=${{ github.event.pull_request.number }}
          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${PR}/comments" \
            --paginate --jq "[.[] | select(.body | startswith(\"${MARKER}\"))][0].id // \"\"")

          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" \
              -X PATCH -f body="$BODY"
          else
            gh api "repos/${{ github.repository }}/issues/${PR}/comments" \
              -f body="$BODY"
          fi

      - name: Fail if yardstick verify failed
        run: |
          [ "${{ needs.measure.outputs.verify_outcome }}" = "success" ]
