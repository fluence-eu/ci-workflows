name: Ruby Gem — Docs PR Check

# Runs on pull requests. Delegates the PR-head measurement to
# ruby-gem-docs-measure.yml (same reusable used by main-push baseline
# runs — zero duplication of the measure logic). Then fetches the
# latest baseline from a main-push `docs-measure.yml` run, posts a
# sticky PR comment with the before/after diff, and fails if the
# PR's yardstick verify step failed.
#
# Same baseline pattern as ruby-gem-coverage-pr.yml: the baseline
# artifact is produced by a dedicated sibling workflow (docs-measure)
# on push to main, fetched here via the workflow runs API.

on:
  workflow_call:
    inputs:
      ruby_version:
        description: Ruby version for the runner
        required: false
        type: string
        default: '4.0'
      measure_workflow_file:
        description: Consumer workflow filename that uploaded the `yardstick-report` artifact on the base branch (used to find the baseline).
        required: false
        type: string
        default: 'docs-measure.yml'
    secrets:
      FLUENCE_CI_BOT_PRIVATE_KEY:
        description: Optional GitHub App private key used to author the sticky PR comment. When omitted, the comment is posted as `github-actions[bot]` via the default `GITHUB_TOKEN`.
        required: false
      FLUENCE_RELEASE_BOT_PRIVATE_KEY:
        description: |
          Optional release App private key. When forwarded, release PRs
          (head_ref `release/v*` authored by the App) skip both measure
          and comment jobs — skipped jobs report as `neutral` and count
          as passing for required status checks, letting auto-merge
          proceed. When omitted, all PRs run normally.
        required: false

permissions:
  contents: read
  packages: read

jobs:
  resolve-bot:
    name: Resolve release-bot
    runs-on: ubuntu-latest
    outputs:
      skip_release_pr: ${{ steps.check.outputs.skip }}
    steps:
      - id: token
        uses: fluence-eu/ci-workflows/actions/release-app-token@v5
        with:
          client-id: ${{ vars.FLUENCE_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLUENCE_RELEASE_BOT_PRIVATE_KEY }}
      - id: check
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          SLUG: ${{ steps.token.outputs.app-slug }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Skip when both conditions hold: PR author is the release App
          # AND head ref starts with `release/v`. SLUG is empty when the
          # consumer didn't forward FLUENCE_RELEASE_BOT_PRIVATE_KEY — the empty
          # match makes skip false, preserving the prior always-run
          # behaviour.
          if [ -n "$SLUG" ] && [ "$AUTHOR" = "${SLUG}[bot]" ] && [[ "$HEAD_REF" == release/v* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release PR detected — skipping measure + comment."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  measure:
    name: Measure
    needs: resolve-bot
    if: needs.resolve-bot.outputs.skip_release_pr == 'false'
    uses: fluence-eu/ci-workflows/.github/workflows/ruby-gem-docs-measure.yml@v5
    with:
      ruby_version: ${{ inputs.ruby_version }}

  comment:
    name: Comment on PR
    needs: [resolve-bot, measure]
    if: needs.resolve-bot.outputs.skip_release_pr == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download PR yardstick report
        uses: actions/download-artifact@v8
        with:
          name: yardstick-report
          path: yardstick-pr/

      - name: Find latest base-branch run with yardstick report
        id: base-run
        uses: fluence-eu/ci-workflows/actions/find-base-run@v5
        with:
          workflow_file: ${{ inputs.measure_workflow_file }}

      - name: Download base yardstick report
        if: steps.base-run.outputs.id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: yardstick-report
          run-id: ${{ steps.base-run.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: yardstick-base/

      - uses: ruby/setup-ruby@v1
        env:
          # Authenticate `bundle install` (triggered by bundler-cache: true)
          # against GitHub Packages so private Fluence gems (e.g.
          # fluence-ci-tools) can be fetched. The job declares
          # `permissions: packages: read` to grant the GITHUB_TOKEN the
          # required scope; the env var hands it to Bundler.
          BUNDLE_RUBYGEMS__PKG__GITHUB__COM: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler-cache: true

      - name: Resolve baseline path
        id: base
        run: |
          if [ -f yardstick-base/yardstick_report.txt ]; then
            echo "path=yardstick-base/yardstick_report.txt" >> "$GITHUB_OUTPUT"
          fi

      - id: body
        uses: fluence-eu/ci-workflows/actions/yardstick-report@v5
        with:
          outcome:   ${{ needs.measure.outputs.verify_outcome }}
          base_ref:  origin/${{ github.base_ref }}
          pr_path:   yardstick-pr/yardstick_report.txt
          base_path: ${{ steps.base.outputs.path }}

      - uses: fluence-eu/ci-workflows/actions/post-sticky-comment@v5
        with:
          marker:          '<!-- yardstick-report -->'
          body:            ${{ steps.body.outputs.body }}
          client-id:       ${{ vars.FLUENCE_CI_BOT_CLIENT_ID }}
          app-private-key: ${{ secrets.FLUENCE_CI_BOT_PRIVATE_KEY }}

      - name: Fail if yardstick verify failed
        run: |
          [ "${{ needs.measure.outputs.verify_outcome }}" = "success" ]
