name: Ruby Gem — Coverage Measure

# Runs `bundle exec fluence-ci tests` (catalog defined in
# Fluence::Ci::Tools::Steps — auto-detects rspec via
# `spec/spec_helper.rb`, minitest via `test/test_helper.rb`, Rails
# via `bin/rails`) with SimpleCov enabled, and uploads the resulting
# `coverage/` folder as the `coverage` artifact. Rubocop is
# intentionally not part of this task — it runs in
# ruby-gem-rubocop-{measure,pr}.yml.
#
# Called from two places:
# - the consumer's `coverage-measure.yml` on push to main, to produce
#   the baseline artifact used by ruby-gem-coverage-pr.yml,
# - ruby-gem-coverage-pr.yml on pull_request, to measure the PR head
#   (no duplication: same reusable, same behaviour).
#
# Mirrors ruby-gem-docs-measure.yml's shape — the two workflows share
# the same measure/compare pattern and the same set of consumer thin
# callers.

on:
  workflow_call:
    inputs:
      ruby_version:
        description: Ruby version for the runner
        required: false
        type: string
        default: '4.0'
      command:
        description: |
          Optional explicit test command, forwarded as `--command
          "..."` to `fluence-ci tests`. When omitted, Steps#tests
          auto-detects (`rspec` for rspec, `bin/rails test` for Rails
          minitest, `bundle exec rake test` for plain minitest). Useful
          for non-standard test runners or to pin to a specific rake
          task on minitest projects.
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: read

jobs:
  measure:
    name: Measure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        env:
          # Authenticate `bundle install` (triggered by bundler-cache: true)
          # against GitHub Packages so private Fluence gems (e.g.
          # fluence-ci-tools) can be fetched. The job declares
          # `permissions: packages: read` to grant the GITHUB_TOKEN the
          # required scope; the env var hands it to Bundler.
          BUNDLE_RUBYGEMS__PKG__GITHUB__COM: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler-cache: true

      - name: Run tests
        # Steps#tests auto-detects rspec / minitest / Rails when no
        # --command override is forwarded. SimpleCov (configured by
        # the consumer in spec_helper / test_helper) writes `coverage/`
        # as a side effect of the run.
        env:
          COMMAND: ${{ inputs.command }}
        shell: bash
        run: |
          if [ -n "$COMMAND" ]; then
            bundle exec fluence-ci tests --command "$COMMAND"
          else
            bundle exec fluence-ci tests
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          include-hidden-files: true
