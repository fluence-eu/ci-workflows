name: Ruby Gem — Coverage Measure

# Runs the gem's test task (rspec or minitest — pick via the
# `rake_task` input, defaults to `spec`) with SimpleCov enabled,
# and uploads the resulting `coverage/` folder as the `coverage`
# artifact. Rubocop is intentionally not part of this task — it
# runs in ruby-gem-rubocop-{measure,pr}.yml.
#
# Called from two places:
# - the consumer's `coverage-measure.yml` on push to main, to produce
#   the baseline artifact used by ruby-gem-coverage-pr.yml,
# - ruby-gem-coverage-pr.yml on pull_request, to measure the PR head
#   (no duplication: same reusable, same behaviour).
#
# Mirrors ruby-gem-docs-measure.yml's shape — the two workflows share
# the same measure/compare pattern and the same set of consumer thin
# callers.

on:
  workflow_call:
    inputs:
      ruby_version:
        description: Ruby version for the runner
        required: false
        type: string
        default: '4.0'
      rake_task:
        description: Rake task to run for coverage generation (e.g. `spec` for rspec-based gems, `test` for minitest-based gems). Must be the test task only — rubocop already runs in the consumer's build matrix.
        required: false
        type: string
        default: 'spec'

permissions:
  contents: read
  packages: read

jobs:
  measure:
    name: Measure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        env:
          # Authenticate `bundle install` (triggered by bundler-cache: true)
          # against GitHub Packages so private Fluence gems (e.g.
          # fluence-ci-tools) can be fetched. The job declares
          # `permissions: packages: read` to grant the GITHUB_TOKEN the
          # required scope; the env var hands it to Bundler.
          BUNDLE_RUBYGEMS__PKG__GITHUB__COM: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake ${{ inputs.rake_task }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          include-hidden-files: true
