name: Ruby Gem — Docs Deploy

# Builds the YARD site of a Ruby gem and deploys the result to
# GitHub Pages. Single responsibility: just deploy.
#
# The yardstick baseline consumed by ruby-gem-docs-pr.yml is
# produced by a dedicated sibling workflow, ruby-gem-docs-measure.yml,
# also triggered on push to main — so deploy and measure stay
# orthogonal.

on:
  workflow_call:
    inputs:
      ruby_version:
        description: Ruby version for the runner
        required: false
        type: string
        default: '4.0'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler-cache: true

      - name: Cache YARD parser output
        uses: actions/cache@v5
        with:
          path: .yardoc
          # YARD's AST cache invalidates on source or yardstick config
          # changes. On miss, the restore-key falls back to the latest
          # cache; YARD then re-parses only the changed .rb files.
          key: yard-${{ runner.os }}-${{ hashFiles('lib/**/*.rb', '.yardopts', '.yardstick.yml') }}
          restore-keys: yard-${{ runner.os }}-

      - name: Build YARD site
        run: bundle exec rake doc:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: doc/

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
