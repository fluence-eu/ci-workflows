name: Ruby Gem — Docs Deploy

# Builds the YARD site of a Ruby gem, uploads the yardstick report
# as an artifact (baseline consumed by ruby-gem-docs-pr.yml's PR
# comments), and deploys the site to GitHub Pages.
#
# The yardstick threshold is NOT re-checked here — ruby-gem-docs-pr.yml
# already gates every PR on verify before merge, so main never drifts
# below threshold without an explicit direct push. `doc:measure` IS
# run though, because its output `yardstick_report.txt` is uploaded
# as an artifact and used as the baseline diff by
# ruby-gem-docs-pr.yml on pull requests.

on:
  workflow_call:
    inputs:
      ruby_version:
        description: Ruby version for the runner
        required: false
        type: string
        default: '4.0'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler-cache: true

      - name: Build YARD site
        run: bundle exec rake doc:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: doc/

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
