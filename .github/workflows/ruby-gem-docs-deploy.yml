name: Ruby Gem — Docs Deploy

# Builds the YARD site of a Ruby gem and deploys the result to
# GitHub Pages. Single responsibility: just deploy.
#
# The yardstick baseline consumed by ruby-gem-docs-pr.yml is
# produced by a dedicated sibling workflow, ruby-gem-docs-measure.yml,
# also triggered on push to main — so deploy and measure stay
# orthogonal.

on:
  workflow_call:
    inputs:
      ruby_version:
        description: Ruby version for the runner
        required: false
        type: string
        default: '4.0'

permissions:
  contents: read
  packages: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        env:
          # Authenticate `bundle install` (triggered by bundler-cache: true)
          # against GitHub Packages so private Fluence gems (e.g.
          # fluence-ci-tools) can be fetched. The job declares
          # `permissions: packages: read` to grant the GITHUB_TOKEN the
          # required scope; the env var hands it to Bundler.
          BUNDLE_RUBYGEMS__PKG__GITHUB__COM: x-access-token:${{ secrets.GITHUB_TOKEN }}
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler-cache: true

      - name: Cache YARD parser output
        uses: actions/cache@v5
        with:
          path: .yardoc
          # The .yardoc blob ties to the YARD runtime — it's keyed on
          # Ruby version (inputs.ruby_version, the source of truth for
          # setup-ruby) and bundled YARD/yardstick versions (Gemfile.lock
          # for apps, gemspec for gems) so a runtime bump can't restore
          # an incompatible AST. Source/config files in hashFiles trigger
          # incremental re-parses; the restore-key fallback keeps the
          # same Ruby-version prefix.
          key: yard-${{ runner.os }}-${{ inputs.ruby_version }}-${{ hashFiles('lib/**/*.rb', '.yardopts', '.yardstick.yml', 'Gemfile.lock', '*.gemspec') }}
          restore-keys: yard-${{ runner.os }}-${{ inputs.ruby_version }}-

      - name: Build YARD site
        # `fluence-ci docs --build` (fluence-ci-tools v0.6+) invokes
        # `bundle exec yard doc` under the catalog. Same effective
        # behaviour as a direct yard CLI call, but routes through the
        # central catalog so the docs-deploy step lines up with the
        # rest of the v3 reusables (no consumer Rakefile dependency,
        # one CLI surface end to end). Output path (`doc/`) unchanged
        # — picked up by the next step.
        run: bundle exec fluence-ci docs --build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: doc/

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
