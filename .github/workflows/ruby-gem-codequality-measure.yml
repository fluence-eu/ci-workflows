name: Ruby Gem — Code Quality Measure

# Runs reek + flog + flay against the consumer's source paths via the
# `fluence-ci codequality --report` CLI (catalog defined in
# Fluence::Ci::Tools::Steps), which writes the three machine-readable
# reports under `tmp/fluence-report/` for upload as the
# `codequality-report` artifact.
#
# Advisory only — none of the tools fail the workflow on findings;
# the PR-side workflow (ruby-gem-codequality-pr.yml) surfaces
# deltas and trends without blocking. Use this alongside
# ruby-gem-rubocop-* if you want strict lint gating; the two
# scopes are intentionally separate (style/correctness vs design
# smell / complexity / duplication).
#
# Path detection lives in Steps#codequality: `app lib` for Rails
# apps/engines (when `app/` exists), `lib` otherwise. Consumers with
# a non-standard layout (monorepo / custom subdirs) can override via
# the `paths` input below — it is forwarded to `fluence-ci
# codequality --paths "..."` so the catalog method's auto-detection
# is bypassed.
#
# Called from two places (mirrors ruby-gem-{docs,coverage,rubocop}-measure):
# - the consumer's codequality-measure.yml on push to main, to
#   produce the baseline artifact used by ruby-gem-codequality-pr.yml,
# - ruby-gem-codequality-pr.yml on pull_request, to measure the PR
#   head (no duplication: same reusable, same behaviour).

on:
  workflow_call:
    inputs:
      ruby_version:
        description: Ruby version for the runner.
        required: false
        type: string
        default: '4.0'
      paths:
        description: |
          Optional space-separated source paths to scan (e.g. `gems/foo lib`
          for monorepos). When omitted, Steps#codequality auto-detects:
          `app lib` for Rails apps/engines, `lib` for plain gems.
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: read

jobs:
  measure:
    name: Measure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        env:
          # Authenticate `bundle install` (triggered by bundler-cache: true)
          # against GitHub Packages so private Fluence gems (e.g.
          # fluence-ci-tools) can be fetched. The job declares
          # `permissions: packages: read` to grant the GITHUB_TOKEN the
          # required scope; the env var hands it to Bundler.
          BUNDLE_RUBYGEMS__PKG__GITHUB__COM: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler-cache: true

      - name: Run codequality (reek + flog + flay)
        # `--report` switches the catalog group to its machine-readable
        # mode: reek/flog/flay write to tmp/fluence-report/{reek.json,
        # flog.txt,flay.txt}. The CLI does not fail on findings — these
        # tools are advisory; the PR sticky comment surfaces trends.
        # `continue-on-error` is kept defensively so a tool crash
        # (rather than a finding) doesn't abort the upload.
        # The optional `paths` input is forwarded as `--paths`; when
        # empty the CLI omits the flag and Steps#codequality applies
        # its `app lib` / `lib` auto-detection.
        continue-on-error: true
        env:
          PATHS: ${{ inputs.paths }}
        shell: bash
        run: |
          if [ -n "$PATHS" ]; then
            bundle exec fluence-ci codequality --report --paths "$PATHS"
          else
            bundle exec fluence-ci codequality --report
          fi

      - name: Upload codequality report
        uses: actions/upload-artifact@v7
        with:
          name: codequality-report
          # The common ancestor (`tmp/fluence-report/`) is stripped by
          # upload-artifact, so the artifact root contains the bare
          # files (reek.json, flog.txt, flay.txt) — same shape the PR
          # workflow already expects.
          path: tmp/fluence-report/*
