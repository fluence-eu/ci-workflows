name: NPM — Prepare Release PR

# Bumps the version field in one or more package.json files, refreshes
# package-lock.json, regenerates CHANGELOG.md from conventional commits
# via git-cliff, opens an auto-merged PR. Companion to npm-release.yml:
# the auto-merged "release: vX" commit fires the release pipeline.
#
# Mono-repo: pass `package_paths: package.json` (default).
# Multi-package monorepo: pass a multiline list. All listed packages
# are released as a tightly-coupled set under one version — their
# current versions MUST match (the workflow fails fast otherwise).
#
# Optional `cross_pin_dependency`: when set to a npm package name, that
# dep is pinned to the new version in every `package_paths` entry that
# declares it. Use this when one workspace package depends on another
# in the same monorepo and you want them released as a tight pair (e.g.
# a UI package importing an internal API from a sibling).
#
# Requires `cliff.toml` at the repo root (mirror the convention from the
# ruby-gem-* family). The reusable does NOT ship a default config — that
# keeps per-repo customization in the consumer's hands.

on:
  workflow_call:
    inputs:
      bump:
        description: "Version bump type (patch|minor|major). The current version is read from the first package.json and bumped accordingly."
        required: true
        type: string
      package_paths:
        description: "Newline-separated list of package.json paths to bump. Defaults to a mono-repo single root package.json."
        required: false
        type: string
        default: |
          package.json
      cross_pin_dependency:
        description: "Optional npm package name to pin to the new version in every package_paths entry that declares it. Empty = no cross-pin."
        required: false
        type: string
        default: ""
      node_version:
        description: "Node version for the runner"
        required: false
        type: string
        default: "22"
    secrets:
      FLUENCE_RELEASE_BOT_PRIVATE_KEY:
        description: Private key of the GitHub App that opens + auto-merges the release PR
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - id: app-token
        uses: fluence-eu/ci-workflows/actions/release-app-token@v5
        with:
          client-id: ${{ vars.FLUENCE_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLUENCE_RELEASE_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: fluence-eu/ci-workflows/actions/setup-release-bot-git@v5
        with:
          app-token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}

      - name: Bump version across all packages (in sync)
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          PACKAGE_PATHS: ${{ inputs.package_paths }}
          CROSS_PIN: ${{ inputs.cross_pin_dependency }}
        run: |
          set -euo pipefail

          # First pass: parse package_paths, verify every current version
          # is identical (a multi-package release would be ambiguous
          # otherwise).
          declare -a PKGS=()
          REFERENCE=""
          while IFS= read -r pkg; do
            pkg="$(echo "$pkg" | xargs)"  # trim
            [ -z "$pkg" ] && continue
            if [ ! -f "$pkg" ]; then
              echo "::error::package.json not found at: $pkg"
              exit 1
            fi
            CURRENT=$(node -p "require('./$pkg').version")
            if [ -z "$REFERENCE" ]; then
              REFERENCE="$CURRENT"
            elif [ "$CURRENT" != "$REFERENCE" ]; then
              echo "::error::Version mismatch: ${pkg} = ${CURRENT}, expected ${REFERENCE}. Multi-package releases require synced versions."
              exit 1
            fi
            PKGS+=("$pkg")
          done <<< "$PACKAGE_PATHS"

          if [ "${#PKGS[@]}" -eq 0 ]; then
            echo "::error::No package_paths provided."
            exit 1
          fi

          # Compute the new version from the shared current.
          IFS='.' read -r MAJOR MINOR PATCH <<< "$REFERENCE"
          case "$BUMP" in
            patch) PATCH=$((PATCH + 1)) ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            *) echo "::error::Invalid bump type '$BUMP'. Use patch, minor, or major." ; exit 1 ;;
          esac
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Bumping ${#PKGS[@]} package(s) from ${REFERENCE} → ${NEW_VERSION}"

          # Second pass: write the new version (and optional cross-pin).
          for pkg in "${PKGS[@]}"; do
            node -e "
              const fs = require('fs');
              const path = process.argv[1];
              const version = process.argv[2];
              const crossPin = process.argv[3];
              const json = JSON.parse(fs.readFileSync(path, 'utf-8'));
              json.version = version;
              if (crossPin && json.dependencies && json.dependencies[crossPin]) {
                json.dependencies[crossPin] = version;
              }
              fs.writeFileSync(path, JSON.stringify(json, null, 2) + '\n');
            " "$pkg" "$NEW_VERSION" "$CROSS_PIN"
          done

          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Refresh package-lock.json
        run: npm install --package-lock-only

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ steps.bump.outputs.tag }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release branch + push
        env:
          TAG: ${{ steps.bump.outputs.tag }}
          PACKAGE_PATHS: ${{ inputs.package_paths }}
        run: |
          set -euo pipefail
          BRANCH="release/${TAG}"
          git checkout -b "$BRANCH"
          # Stage every bumped package.json plus the refreshed lock + changelog.
          while IFS= read -r pkg; do
            pkg="$(echo "$pkg" | xargs)"
            [ -z "$pkg" ] && continue
            git add "$pkg"
          done <<< "$PACKAGE_PATHS"
          [ -f package-lock.json ] && git add package-lock.json
          [ -f CHANGELOG.md ] && git add CHANGELOG.md
          git commit -m "release: ${TAG}"
          git push -u origin "$BRANCH"

      - name: Create release PR
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.bump.outputs.tag }}
          VERSION: ${{ steps.bump.outputs.version }}
          PACKAGE_PATHS: ${{ inputs.package_paths }}
        run: |
          set -euo pipefail
          # Build a human-friendly bullet list of affected packages.
          PACKAGES_LIST=$(while IFS= read -r pkg; do
            pkg="$(echo "$pkg" | xargs)"
            [ -z "$pkg" ] && continue
            name=$(node -p "require('./$pkg').name")
            printf -- '- `%s` → `%s`\n' "$name" "$TAG"
          done <<< "$PACKAGE_PATHS")
          BODY=$(printf 'Version bump for npm package(s):\n\n%s\n\nAuto-merged once required checks pass.' "$PACKAGES_LIST")
          PR_URL=$(gh pr create \
            --base main \
            --title "release: ${TAG}" \
            --body "$BODY")
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - uses: fluence-eu/ci-workflows/actions/automerge-pr-with-retry@v5
        with:
          pr-url: ${{ steps.pr.outputs.url }}
          app-token: ${{ steps.app-token.outputs.token }}
