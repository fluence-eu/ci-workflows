name: Claude — Specialist PR Review

# Runs on pull requests. Same advisory role as claude-review-pr.yml, but the
# review is delegated to the `review@fluence` plugin from
# fluence-eu/claude-config: `/review:pr --mode ci` launches the correctness
# and security reviewers in parallel, has every finding checked by an
# independent verifier, and posts a single GitHub review (COMMENT, never
# blocking). The full set of reviewers (design, data, tests) runs locally
# before the PR is opened, with the same plugin — CI is the safety net.
#
# The reviewer prompts live in the plugin, not here: this workflow only
# wires the checkout, the private marketplace and the tool whitelist.
#
# Unlike claude-review-pr.yml, a failed run is not masked by
# continue-on-error: a review that did not happen must not look green.

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: |
          OAuth token generated by `claude setup-token` against a Claude
          Pro/Max subscription — same secret as claude-review-pr.yml.
        required: true
      FLUENCE_RELEASE_BOT_PRIVATE_KEY:
        description: |
          Release App private key. Used twice: release PRs (head_ref
          `release/v*` authored by the App) skip the review, and the App
          mints a read-only token on fluence-eu/claude-config, the private
          plugin marketplace. Without it the plugin cannot be installed.
        required: true

permissions:
  contents: read

jobs:
  resolve-bot:
    name: Resolve release-bot
    runs-on: ubuntu-latest
    outputs:
      skip_release_pr: ${{ steps.check.outputs.skip }}
    steps:
      - id: token
        uses: fluence-eu/ci-workflows/actions/release-app-token@v6
        with:
          client-id: ${{ vars.FLUENCE_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLUENCE_RELEASE_BOT_PRIVATE_KEY }}
      - id: check
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ACTOR: ${{ github.actor }}
          SLUG: ${{ steps.token.outputs.app-slug }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Dependabot runs get empty Actions secrets: without the skip, every
          # dependency bump would show a red review check.
          if [ "$ACTOR" = "dependabot[bot]" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Dependabot PR — skipping Claude review."
          elif [ -n "$SLUG" ] && [ "$AUTHOR" = "${SLUG}[bot]" ] && [[ "$HEAD_REF" == release/v* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release PR detected — skipping Claude review."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  review:
    name: Review
    needs: resolve-bot
    # Drafts are reviewed once marked ready (consumers listen to ready_for_review).
    if: needs.resolve-bot.outputs.skip_release_pr == 'false' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-review-specialists-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # The PR head, not the merge commit: inline comments are anchored on
      # head line numbers, and the plugin diffs merge-base..head itself.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Generate release App token (read-only access to claude-config)
        id: marketplace
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FLUENCE_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLUENCE_RELEASE_BOT_PRIVATE_KEY }}
          owner: fluence-eu
          repositories: claude-config
          permission-contents: read

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://x-access-token:${{ steps.marketplace.outputs.token }}@github.com/fluence-eu/claude-config.git
          plugins: |
            style@fluence
            review@fluence
          prompt: /review:pr ${{ github.event.pull_request.number }} --mode ci
          claude_args: |
            --max-turns 60
            --allowedTools "Agent,Read,Grep,Glob,Bash(git diff:*),Bash(git show:*),Bash(git log:*),Bash(git grep:*),Bash(git merge-base:*),Bash(git rev-parse:*),Bash(git fetch:*),Bash(gh pr view:*),Bash(gh api:*)"
