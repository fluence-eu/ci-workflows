name: Ruby Gem — Docs Measure

# Runs yardstick (measure + verify soft), uploads the report as
# `yardstick-report`, and exposes the verify step's outcome as a
# job output.
#
# Called from two places:
# - the consumer's `docs-measure.yml` on push to main, to produce the
#   baseline artifact used by ruby-gem-docs-pr.yml,
# - ruby-gem-docs-pr.yml on pull_request, to measure the PR head
#   (no duplication: same reusable, same behaviour).
#
# `doc:verify` runs with `continue-on-error: true`: a failure does
# not abort the upload. The PR workflow consumes the verify_outcome
# output to decide whether to fail the run (after posting the sticky
# comment). The main-push invocation does not gate on the outcome —
# threshold enforcement is PR-side, main cannot drift below
# threshold without a PR having previously been merged that shouldn't
# have passed.

on:
  workflow_call:
    inputs:
      ruby_version:
        description: Ruby version for the runner
        required: false
        type: string
        default: '4.0'
    outputs:
      verify_outcome:
        description: Outcome of `rake doc:verify` (`success` / `failure`).
        value: ${{ jobs.measure.outputs.verify_outcome }}

permissions:
  contents: read

jobs:
  measure:
    name: Measure
    runs-on: ubuntu-latest
    outputs:
      verify_outcome: ${{ steps.verify.outcome }}
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler-cache: true

      - name: Cache YARD parser output
        uses: actions/cache@v5
        with:
          path: .yardoc
          # The .yardoc blob ties to the YARD runtime — it's keyed on
          # Ruby version (inputs.ruby_version, the source of truth for
          # setup-ruby) and bundled YARD/yardstick versions (Gemfile.lock
          # for apps, gemspec for gems) so a runtime bump can't restore
          # an incompatible AST. Source/config files in hashFiles trigger
          # incremental re-parses; the restore-key fallback keeps the
          # same Ruby-version prefix.
          key: yard-${{ runner.os }}-${{ inputs.ruby_version }}-${{ hashFiles('lib/**/*.rb', '.yardopts', '.yardstick.yml', 'Gemfile.lock', '*.gemspec') }}
          restore-keys: yard-${{ runner.os }}-${{ inputs.ruby_version }}-

      - name: Run yardstick measurement
        run: bundle exec rake doc:measure

      - name: Run yardstick verify
        id: verify
        continue-on-error: true
        run: bundle exec rake doc:verify

      - name: Upload yardstick report
        uses: actions/upload-artifact@v7
        with:
          name: yardstick-report
          path: doc/yardstick_report.txt
