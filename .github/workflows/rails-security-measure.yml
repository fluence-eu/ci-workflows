name: Rails — Security Measure

# Runs brakeman + bundler-audit + ruby-audit on a Rails app, captures
# their outputs, uploads them as the `security-report` artifact, and
# exposes the three step outcomes as job outputs.
#
# Called from two places (mirrors ruby-gem-{docs,coverage,rubocop}-measure):
# - the consumer's security-measure.yml on push to the working
#   branch, to produce the baseline artifact used by
#   rails-security-pr.yml,
# - rails-security-pr.yml on pull_request, to measure the PR head
#   (no duplication: same reusable, same behaviour).
#
# All three tools run with `continue-on-error: true` — a finding is
# surfaced via the outcome output, not by aborting the upload. The
# PR workflow consumes the outcomes to decide whether to fail the
# run (after posting the sticky comment). The push-baseline
# invocation does not gate on the outcomes — main may technically
# carry pre-existing warnings without a CI failure, the diff on the
# PR side is what catches regressions.

on:
  workflow_call:
    inputs:
      ruby_version:
        description: Ruby version for the runner.
        required: false
        type: string
        default: '4.0'
    outputs:
      brakeman_outcome:
        description: Outcome of the brakeman step (`success` / `failure`).
        value: ${{ jobs.measure.outputs.brakeman_outcome }}
      audit_outcome:
        description: Outcome of the bundler-audit step (`success` / `failure`).
        value: ${{ jobs.measure.outputs.audit_outcome }}
      ruby_audit_outcome:
        description: Outcome of the ruby-audit step (`success` / `failure`).
        value: ${{ jobs.measure.outputs.ruby_audit_outcome }}

permissions:
  contents: read
  packages: read

jobs:
  measure:
    name: Measure
    runs-on: ubuntu-latest
    outputs:
      brakeman_outcome: ${{ steps.brakeman.outcome }}
      audit_outcome: ${{ steps.audit.outcome }}
      ruby_audit_outcome: ${{ steps.ruby_audit.outcome }}
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        env:
          # Authenticate `bundle install` (triggered by bundler-cache: true)
          # against GitHub Packages so private Fluence gems (e.g.
          # fluence-ci-tools) can be fetched. The job declares
          # `permissions: packages: read` to grant the GITHUB_TOKEN the
          # required scope; the env var hands it to Bundler.
          BUNDLE_RUBYGEMS__PKG__GITHUB__COM: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler-cache: true

      - name: Run brakeman (Rails static analysis)
        id: brakeman
        continue-on-error: true
        run: bundle exec brakeman --no-pager --format json --output brakeman.json

      - name: Run bundler-audit (gem CVE scan)
        id: audit
        continue-on-error: true
        # `--update` refreshes the local CVE database before the
        # check so a vulnerability disclosed since the previous run
        # is still caught. `tee` keeps the human-readable output
        # both in the logs and on disk for the report composite;
        # `pipefail` preserves bundler-audit's exit code through
        # the pipe so `continue-on-error` records the right outcome.
        shell: bash
        run: |
          set -o pipefail
          bundle exec bundler-audit check --update | tee audit.txt

      - name: Run ruby-audit (Ruby/RubyGems CVE scan)
        id: ruby_audit
        continue-on-error: true
        # `-n` skips ruby-audit's own ruby-advisory-db update because
        # bundler-audit just refreshed the same shared DB above.
        # ruby-audit has no machine-readable format, so `tee` mirrors
        # stdout to disk for the report composite. `pipefail`
        # preserves the exit code through the pipe.
        shell: bash
        run: |
          set -o pipefail
          bundle exec ruby-audit check -n | tee ruby_audit.txt

      - name: Upload security report
        uses: actions/upload-artifact@v7
        with:
          name: security-report
          path: |
            brakeman.json
            audit.txt
            ruby_audit.txt
