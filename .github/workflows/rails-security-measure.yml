name: Rails — Security Measure

# Runs brakeman + bundler-audit + ruby-audit on a Rails app, captures
# their outputs, uploads them as the `security-report` artifact, and
# exposes the three step outcomes as job outputs.
#
# Called from two places (mirrors ruby-gem-{docs,coverage,rubocop}-measure):
# - the consumer's security-measure.yml on push to the working
#   branch, to produce the baseline artifact used by
#   rails-security-pr.yml,
# - rails-security-pr.yml on pull_request, to measure the PR head
#   (no duplication: same reusable, same behaviour).
#
# All three tools run with `continue-on-error: true` — a finding is
# surfaced via the outcome output, not by aborting the upload. The
# PR workflow consumes the outcomes to decide whether to fail the
# run (after posting the sticky comment). The push-baseline
# invocation does not gate on the outcomes — main may technically
# carry pre-existing warnings without a CI failure, the diff on the
# PR side is what catches regressions.

on:
  workflow_call:
    outputs:
      security_outcome:
        description: Outcome of the combined security suite (`success` / `failure`).
        value: ${{ jobs.measure.outputs.security_outcome }}

permissions:
  contents: read
  packages: read

jobs:
  measure:
    name: Measure
    runs-on: ubuntu-latest
    outputs:
      security_outcome: ${{ steps.security.outcome }}
    steps:
      - uses: actions/checkout@v6

      - name: Read .fluence-ci.yml
        id: cfg
        uses: fluence-eu/ci-workflows/actions/read-config@v6
        with:
          keys: |
            ruby_version=ruby_version=

      - name: Resolve Ruby version
        id: ruby
        uses: fluence-eu/ci-workflows/actions/resolve-version@v6
        with:
          config_version: ${{ fromJSON(steps.cfg.outputs.values).ruby_version }}
          file: .ruby-version
          default: '4.0'

      - uses: ruby/setup-ruby@v1
        env:
          # Authenticate `bundle install` (triggered by bundler-cache: true)
          # against GitHub Packages so private Fluence gems (e.g.
          # fluence-ci-tools) can be fetched. The job declares
          # `permissions: packages: read` to grant the GITHUB_TOKEN the
          # required scope; the env var hands it to Bundler.
          BUNDLE_RUBYGEMS__PKG__GITHUB__COM: x-access-token:${{ secrets.GITHUB_TOKEN }}
        with:
          ruby-version: ${{ steps.ruby.outputs.version }}
          bundler-cache: true

      # Invokes the gem's `security --report` command (not the three
      # tools individually) so the catalog defined in
      # `Fluence::Ci::Tools::Steps#security` is the single source of
      # truth. The same command runs locally via the consumer's
      # `bin/fluence-ci`, guaranteeing zero drift between dev pre-push
      # and CI. The combined exit code is used as the single outcome;
      # the security-report composite reads each tool's output file
      # to render the per-tool ✓/✗ in the sticky comment.
      - name: Run security suite (via fluence-ci)
        id: security
        continue-on-error: true
        run: bundle exec fluence-ci security --report

      - name: Upload security report
        uses: actions/upload-artifact@v7
        with:
          name: security-report
          path: |
            tmp/fluence-report/brakeman.json
            tmp/fluence-report/audit.txt
            tmp/fluence-report/ruby_audit.txt
