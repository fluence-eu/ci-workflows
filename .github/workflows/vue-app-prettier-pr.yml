name: Vue App — Prettier PR Check

on:
  workflow_call:
    inputs:
      node_version:
        required: false
        type: string
        default: '20'
      format_command:
        required: false
        type: string
        default: 'npx --no-install prettier --check .'
      measure_workflow_file:
        required: false
        type: string
        default: 'prettier-measure.yml'
    secrets:
      FLUENCE_CI_BOT_PRIVATE_KEY: { required: false }
      RELEASE_APP_PRIVATE_KEY: { required: false }

permissions:
  contents: read
  packages: read

jobs:
  resolve-bot:
    name: Resolve release-bot
    runs-on: ubuntu-latest
    outputs:
      skip_release_pr: ${{ steps.check.outputs.skip }}
    steps:
      - id: token
        uses: fluence-eu/ci-workflows/actions/release-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - id: check
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          SLUG: ${{ steps.token.outputs.app-slug }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -n "$SLUG" ] && [ "$AUTHOR" = "${SLUG}[bot]" ] && [[ "$HEAD_REF" == release/v* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  measure:
    name: Measure
    needs: resolve-bot
    if: needs.resolve-bot.outputs.skip_release_pr == 'false'
    uses: fluence-eu/ci-workflows/.github/workflows/vue-app-prettier-measure.yml@v3
    with:
      node_version: ${{ inputs.node_version }}
      format_command: ${{ inputs.format_command }}

  comment:
    name: Comment on PR
    needs: [resolve-bot, measure]
    if: needs.resolve-bot.outputs.skip_release_pr == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }

      - name: Download PR prettier report
        uses: actions/download-artifact@v8
        with: { name: prettier-report, path: prettier-pr/ }

      - name: Find latest base-branch run with prettier report
        id: base-run
        uses: fluence-eu/ci-workflows/actions/find-base-run@v3
        with:
          workflow_file: ${{ inputs.measure_workflow_file }}

      - name: Download base prettier report
        if: steps.base-run.outputs.id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: prettier-report
          run-id: ${{ steps.base-run.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: prettier-base/

      - name: Build sticky-comment body
        id: body
        run: |
          pr_count=0
          base_count=0
          [ -f prettier-pr/prettier.txt ]   && pr_count=$(grep -cE '^\[warn\] ' prettier-pr/prettier.txt || true)
          [ -f prettier-base/prettier.txt ] && base_count=$(grep -cE '^\[warn\] ' prettier-base/prettier.txt || true)
          delta=$((pr_count - base_count))
          if [ "$delta" -gt 0 ]; then icon="🔴 +$delta"
          elif [ "$delta" -lt 0 ]; then icon="🟢 $delta"
          else icon="—"
          fi
          {
            echo "body<<BODY_EOF"
            echo "## 💅 Prettier: $pr_count unformatted file(s)"
            echo
            echo "| Metric | Base | PR | Δ |"
            echo "| --- | ---: | ---: | ---: |"
            echo "| Unformatted | $base_count | $pr_count | $icon |"
            echo "BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: fluence-eu/ci-workflows/actions/post-sticky-comment@v3
        with:
          marker:          '<!-- prettier-report -->'
          body:            ${{ steps.body.outputs.body }}
          client-id:       ${{ vars.FLUENCE_CI_CLIENT_ID }}
          app-private-key: ${{ secrets.FLUENCE_CI_BOT_PRIVATE_KEY }}

      - name: Fail if prettier failed
        run: |
          [ "${{ needs.measure.outputs.prettier_outcome }}" = "success" ]
