name: Vue App — TypeScript Measure

# Runs vue-tsc --noEmit, captures stderr to tsc.txt, and uploads it
# as `tsc-report`. Exposes the step's outcome as a job output.

on:
  workflow_call:
    outputs:
      tsc_outcome:
        description: Outcome of the typecheck step.
        value: ${{ jobs.measure.outputs.tsc_outcome }}
    secrets:
      NPMRC_AUTH:
        description: |
          Multi-line .npmrc content (one or more `//host/:_authToken=…` lines) appended verbatim to `~/.npmrc` before `npm ci`. Supports any number of private registries.
        required: false

permissions:
  contents: read
  packages: read

jobs:
  measure:
    name: Measure
    runs-on: ubuntu-latest
    outputs:
      tsc_outcome: ${{ steps.tsc.outcome }}
    steps:
      - uses: actions/checkout@v6

      - name: Read .fluence-ci.yml
        id: cfg
        uses: fluence-eu/ci-workflows/actions/read-config@v6
        with:
          keys: |
            node_version=node_version=20
            pre_install_command=pre_install_command=
            typecheck_command=tsc.typecheck_command=npx --no-install vue-tsc --noEmit

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ fromJSON(steps.cfg.outputs.values).node_version }}
          cache: 'npm'

      - name: Pre-install setup
        if: fromJSON(steps.cfg.outputs.values).pre_install_command != ''
        run: ${{ fromJSON(steps.cfg.outputs.values).pre_install_command }}

      - name: Configure private npm registries
        if: env.NPMRC_AUTH != ''
        env:
          NPMRC_AUTH: ${{ secrets.NPMRC_AUTH }}
        run: printf '%s\n' "$NPMRC_AUTH" >> "$HOME/.npmrc"

      - run: npm ci

      - name: Run vue-tsc
        id: tsc
        continue-on-error: true
        run: |
          mkdir -p tmp/fluence-report
          ${{ fromJSON(steps.cfg.outputs.values).typecheck_command }} 2>&1 | tee tmp/fluence-report/tsc.txt
          exit ${PIPESTATUS[0]}

      - name: Upload tsc report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tsc-report
          path: tmp/fluence-report/tsc.txt
          if-no-files-found: warn
