name: Vue App — Vitest PR Check

on:
  workflow_call:
    inputs:
      node_version:
        required: false
        type: string
        default: '20'
      test_command:
        required: false
        type: string
        default: 'npx --no-install vitest run --reporter=json --outputFile=tmp/fluence-report/vitest.json'
      measure_workflow_file:
        required: false
        type: string
        default: 'vitest-measure.yml'
    secrets:
      FLUENCE_CI_BOT_PRIVATE_KEY: { required: false }
      RELEASE_APP_PRIVATE_KEY: { required: false }

permissions:
  contents: read
  packages: read

jobs:
  resolve-bot:
    name: Resolve release-bot
    runs-on: ubuntu-latest
    outputs:
      skip_release_pr: ${{ steps.check.outputs.skip }}
    steps:
      - id: token
        uses: fluence-eu/ci-workflows/actions/release-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - id: check
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          SLUG: ${{ steps.token.outputs.app-slug }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -n "$SLUG" ] && [ "$AUTHOR" = "${SLUG}[bot]" ] && [[ "$HEAD_REF" == release/v* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  measure:
    name: Measure
    needs: resolve-bot
    if: needs.resolve-bot.outputs.skip_release_pr == 'false'
    uses: fluence-eu/ci-workflows/.github/workflows/vue-app-vitest-measure.yml@v3
    with:
      node_version: ${{ inputs.node_version }}
      test_command: ${{ inputs.test_command }}

  comment:
    name: Comment on PR
    needs: [resolve-bot, measure]
    if: needs.resolve-bot.outputs.skip_release_pr == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }

      - name: Download PR vitest report
        uses: actions/download-artifact@v8
        with: { name: vitest-report, path: vitest-pr/ }

      - name: Find latest base-branch run with vitest report
        id: base-run
        uses: fluence-eu/ci-workflows/actions/find-base-run@v3
        with:
          workflow_file: ${{ inputs.measure_workflow_file }}

      - name: Download base vitest report
        if: steps.base-run.outputs.id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: vitest-report
          run-id: ${{ steps.base-run.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: vitest-base/

      - name: Build sticky-comment body
        id: body
        run: |
          read_metric() { jq -r "$2 // 0" "$1" 2>/dev/null || echo 0; }
          pr_total=0; pr_failed=0; base_total=0; base_failed=0
          if [ -f vitest-pr/vitest.json ]; then
            pr_total=$(read_metric vitest-pr/vitest.json '.numTotalTests')
            pr_failed=$(read_metric vitest-pr/vitest.json '.numFailedTests')
          fi
          if [ -f vitest-base/vitest.json ]; then
            base_total=$(read_metric vitest-base/vitest.json '.numTotalTests')
            base_failed=$(read_metric vitest-base/vitest.json '.numFailedTests')
          fi
          delta=$((pr_failed - base_failed))
          if [ "$delta" -gt 0 ]; then icon="🔴 +$delta"
          elif [ "$delta" -lt 0 ]; then icon="🟢 $delta"
          else icon="—"
          fi
          status="✅"
          [ "$pr_failed" -gt 0 ] && status="❌"
          {
            echo "body<<BODY_EOF"
            echo "## ${status} Vitest: $pr_total test(s), $pr_failed failure(s)"
            echo
            echo "| Metric | Base | PR | Δ |"
            echo "| --- | ---: | ---: | ---: |"
            echo "| Total tests | $base_total | $pr_total | — |"
            echo "| Failed | $base_failed | $pr_failed | $icon |"
            echo "BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: fluence-eu/ci-workflows/actions/post-sticky-comment@v3
        with:
          marker:          '<!-- vitest-report -->'
          body:            ${{ steps.body.outputs.body }}
          client-id:       ${{ vars.FLUENCE_CI_CLIENT_ID }}
          app-private-key: ${{ secrets.FLUENCE_CI_BOT_PRIVATE_KEY }}

      - name: Fail if vitest failed
        run: |
          [ "${{ needs.measure.outputs.vitest_outcome }}" = "success" ]
