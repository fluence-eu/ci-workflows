name: Ruby Gem — RuboCop PR Check

# Runs on pull requests. Delegates the PR-head measurement to
# ruby-gem-rubocop-measure.yml (same reusable used by main-push
# baseline runs — zero duplication of the measure logic). Then
# fetches the latest baseline from a main-push `rubocop-measure.yml`
# run, posts a sticky PR comment with the before/after diff, and
# fails if the PR introduced any rubocop offenses.
#
# Same baseline pattern as ruby-gem-coverage-pr.yml and
# ruby-gem-docs-pr.yml.

on:
  workflow_call:
    inputs:
      ruby_version:
        description: Ruby version for the runner
        required: false
        type: string
        default: '4.0'
      measure_workflow_file:
        description: Consumer workflow filename that uploaded the `rubocop-report` artifact on the base branch (used to find the baseline).
        required: false
        type: string
        default: 'rubocop-measure.yml'
    secrets:
      FLUENCE_CI_BOT_PRIVATE_KEY:
        description: Optional GitHub App private key used to author the sticky PR comment. When omitted, the comment is posted as `github-actions[bot]` via the default `GITHUB_TOKEN`.
        required: false

permissions:
  contents: read

jobs:
  measure:
    name: Measure
    uses: fluence-eu/ci-workflows/.github/workflows/ruby-gem-rubocop-measure.yml@v2
    with:
      ruby_version: ${{ inputs.ruby_version }}

  comment:
    name: Comment on PR
    needs: measure
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download PR rubocop report
        uses: actions/download-artifact@v8
        with:
          name: rubocop-report
          path: rubocop-pr/

      - name: Find latest base-branch run with rubocop report
        id: base-run
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: ${{ inputs.measure_workflow_file }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # `status=success` is silently ignored by the runs endpoint
          # (success is a conclusion, not a status). Query completed
          # runs and filter by .conclusion in jq.
          RUN_ID=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/${WORKFLOW_FILE}/runs?branch=${BASE_REF}&status=completed&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id // ""')
          echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download base rubocop report
        if: steps.base-run.outputs.id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: rubocop-report
          run-id: ${{ steps.base-run.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: rubocop-base/

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler-cache: true

      - name: Resolve baseline path
        id: base
        run: |
          if [ -f rubocop-base/rubocop.json ]; then
            echo "path=rubocop-base/rubocop.json" >> "$GITHUB_OUTPUT"
          fi

      - id: body
        uses: fluence-eu/ci-workflows/actions/rubocop-report@v2
        with:
          outcome:   ${{ needs.measure.outputs.rubocop_outcome }}
          base_ref:  origin/${{ github.base_ref }}
          pr_path:   rubocop-pr/rubocop.json
          base_path: ${{ steps.base.outputs.path }}

      - uses: fluence-eu/ci-workflows/actions/post-sticky-comment@v2
        with:
          marker:          '<!-- rubocop-report -->'
          body:            ${{ steps.body.outputs.body }}
          app-id:          ${{ vars.FLUENCE_CI_BOT_ID }}
          app-private-key: ${{ secrets.FLUENCE_CI_BOT_PRIVATE_KEY }}

      - name: Fail if rubocop failed
        run: |
          [ "${{ needs.measure.outputs.rubocop_outcome }}" = "success" ]
