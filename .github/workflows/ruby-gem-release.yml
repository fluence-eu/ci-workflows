name: Ruby Gem — Release

on:
  workflow_call:
    inputs:
      gem_name:
        description: Gem name (must match gemspec filename without extension)
        required: true
        type: string
      ruby_version:
        description: Ruby version for the runner
        required: false
        type: string
        default: '4.0'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler-cache: true

      - name: Get version from gemspec
        id: version
        env:
          GEM_NAME: ${{ inputs.gem_name }}
        run: |
          VERSION=$(ruby -e "puts Gem::Specification.load('${GEM_NAME}.gemspec').version")
          if [[ -z "$VERSION" ]]; then
            echo "ERROR: could not load version from ${GEM_NAME}.gemspec" >&2
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: check
        run: |
          git fetch --tags
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            # Path-filtered triggers fire on any commit that touches
            # version.rb — including style fixes that don't actually
            # bump the constant. When that happens we hit a tag that
            # already exists; skip the rest of the job rather than
            # 422-ing on `gh release create`.
            echo "::notice::Tag ${{ steps.version.outputs.tag }} already exists — skipping release (version.rb modified without a bump)."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Extract changelog for version
        if: steps.check.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk "/^## \[$VERSION\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > release-notes.md

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.version.outputs.tag }} \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file release-notes.md

      - name: Build gem
        if: steps.check.outputs.exists == 'false'
        run: gem build ${{ inputs.gem_name }}.gemspec

      - name: Attach gem to release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ steps.version.outputs.tag }} ${{ inputs.gem_name }}-*.gem --clobber
