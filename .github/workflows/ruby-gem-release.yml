name: Ruby Gem — Release

# Triggered by consumer via push to main on the tracked version files.
# Verifies the commit was authored by the release bot, reads the
# version from each gemspec, delegates to the tag-and-release composite
# (as a draft), builds + attaches each gem, then publishes the Release.
# Publishing last means the `release: published` event that triggers
# ruby-gem-publish.yml only fires once the gems are attached.
#
# Companion to ruby-gem-prepare-release.yml: that workflow auto-merges
# a "release: vX" commit touching version.rb files, which is what fires
# this workflow.

on:
  workflow_call:
    secrets:
      FLUENCE_RELEASE_BOT_PRIVATE_KEY:
        description: "Private key of the release GitHub App. Used to verify the release author and to emit the release-published event that triggers downstream publish workflows."
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - id: app-token
        uses: fluence-eu/ci-workflows/actions/release-app-token@v6
        with:
          client-id: ${{ vars.FLUENCE_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLUENCE_RELEASE_BOT_PRIVATE_KEY }}

      - id: verify
        uses: fluence-eu/ci-workflows/actions/verify-release-author@v6
        with:
          app-slug: ${{ steps.app-token.outputs.app-slug }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v7
        if: steps.verify.outputs.is_release == 'true'
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Read .fluence-ci.yml
        id: cfg
        if: steps.verify.outputs.is_release == 'true'
        uses: fluence-eu/ci-workflows/actions/read-config@v6
        with:
          keys: |
            gem_specs=release.gem_specs=
          required: gem_specs

      - name: Resolve Ruby version
        id: ruby
        uses: fluence-eu/ci-workflows/actions/resolve-version@v6
        with:
          runtime: ruby

      - uses: ruby/setup-ruby@v1
        if: steps.verify.outputs.is_release == 'true'
        env:
          # Authenticate `bundle install` (triggered by bundler-cache: true)
          # against GitHub Packages so private Fluence gems (e.g.
          # guardian-ci) can be fetched. The job declares
          # `permissions: packages: read` to grant the GITHUB_TOKEN the
          # required scope; the env var hands it to Bundler.
          BUNDLE_RUBYGEMS__PKG__GITHUB__COM: x-access-token:${{ secrets.GITHUB_TOKEN }}
        with:
          ruby-version: ${{ steps.ruby.outputs.version }}
          bundler-cache: true

      - uses: fluence-eu/ci-workflows/actions/setup-release-bot-git@v6
        if: steps.verify.outputs.is_release == 'true'
        with:
          app-token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      - id: version
        if: steps.verify.outputs.is_release == 'true'
        uses: fluence-eu/ci-workflows/actions/read-and-verify-ruby-gem-versions@v6
        with:
          gem-specs: ${{ fromJSON(steps.cfg.outputs.values).gem_specs }}

      - uses: fluence-eu/ci-workflows/actions/tag-and-release@v6
        id: tag
        if: steps.verify.outputs.is_release == 'true'
        with:
          tag: ${{ steps.version.outputs.tag }}
          notes-source: changelog
          changelog-path: CHANGELOG.md
          app-token: ${{ steps.app-token.outputs.token }}
          # Create the Release as a draft so `release: published` does not
          # fire before the gems are attached below. The "Publish the
          # release" step flips it once the assets are in place.
          draft: true

      - name: Build and attach gems
        if: steps.verify.outputs.is_release == 'true' && steps.tag.outputs.skipped == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.version.outputs.tag }}
          GEM_NAMES: ${{ steps.version.outputs.gem_names }}
        run: |
          set -euo pipefail
          for GEM_NAME in $GEM_NAMES; do
            gem build "${GEM_NAME}.gemspec"
            gh release upload "$TAG" "${GEM_NAME}"-*.gem --clobber
          done

      - name: Publish the release (now that gems are attached)
        if: steps.verify.outputs.is_release == 'true' && steps.tag.outputs.skipped == 'false'
        env:
          # App token so the resulting `release: published` event can
          # trigger downstream workflows (ruby-gem-publish.yml). The
          # release was created as a draft by tag-and-release; flipping
          # it to published now fires the event with the .gem assets
          # already in place, so ruby-gem-publish.yml downloads them
          # without racing the upload. Gated on skipped == false (same as
          # the attach step) so a re-run never publishes an asset-less draft.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
