name: Ruby Gem — Release

# Triggered by consumer via push to main on the tracked version files.
# Verifies the commit was authored by the release bot, reads the
# version from each gemspec, delegates to the tag-and-release composite,
# then builds + attaches each gem to the Release.
#
# Companion to ruby-gem-prepare-release.yml: that workflow auto-merges
# a "release: vX" commit touching version.rb files, which is what fires
# this workflow.

on:
  workflow_call:
    inputs:
      gem_specs:
        description: "Newline-separated list of gem names (without .gemspec). Multi-gem releases require all gemspec versions to match."
        required: true
        type: string
      ruby_version:
        description: "Ruby version for the runner"
        required: false
        type: string
        default: "4.0"
    secrets:
      FLUENCE_RELEASE_BOT_PRIVATE_KEY:
        description: "Private key of the release GitHub App. Used to verify the release author and to emit the release-published event that triggers downstream publish workflows."
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - id: app-token
        uses: fluence-eu/ci-workflows/actions/release-app-token@v5
        with:
          client-id: ${{ vars.FLUENCE_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLUENCE_RELEASE_BOT_PRIVATE_KEY }}

      - name: Verify release was authored by the release bot
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
          AUTHOR: ${{ github.event.head_commit.author.name }}
          MSG: ${{ github.event.head_commit.message }}
          REPO: ${{ github.repository }}
        run: |
          # The version.rb / CHANGELOG.md paths filter on the consumer's
          # release.yml also fires for feature/chore merges that happen
          # to touch those files (e.g. retro-cleanup, style fixes). Skip
          # cleanly when the commit message does not look like a release
          # — the auth check stays loud for anything that does.
          case "$MSG" in
            "release: v"*|*"from "*"/release/v"*) : ;;
            *)
              echo "Not a release commit, skipping subsequent steps."
              echo "is_release=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          # Squash merge: commit author is the bot directly.
          if [ "$AUTHOR" = "$EXPECTED_BOT" ]; then
            echo "Verified: commit authored by $AUTHOR"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Merge commit: extract PR number and check the PR author.
          PR_NUM=$(printf '%s' "$MSG" | grep -oE '#[0-9]+' | tr -d '#' | head -1)
          if [ -n "$PR_NUM" ]; then
            PR_AUTHOR=$(gh pr view "$PR_NUM" --repo "$REPO" --json author --jq '.author.login')
            if [ "$PR_AUTHOR" = "$EXPECTED_BOT" ]; then
              echo "Verified: PR #${PR_NUM} authored by $PR_AUTHOR"
              echo "is_release=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Release PR #${PR_NUM} authored by ${PR_AUTHOR}, expected ${EXPECTED_BOT}"
            exit 1
          fi
          echo "::error::Could not verify release author (commit by ${AUTHOR}, no PR found)"
          exit 1

      - uses: actions/checkout@v6
        if: steps.verify.outputs.is_release == 'true'
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: ruby/setup-ruby@v1
        if: steps.verify.outputs.is_release == 'true'
        env:
          # Authenticate `bundle install` (triggered by bundler-cache: true)
          # against GitHub Packages so private Fluence gems (e.g.
          # fluence-ci-tools) can be fetched. The job declares
          # `permissions: packages: read` to grant the GITHUB_TOKEN the
          # required scope; the env var hands it to Bundler.
          BUNDLE_RUBYGEMS__PKG__GITHUB__COM: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler-cache: true

      - uses: fluence-eu/ci-workflows/actions/setup-release-bot-git@v5
        if: steps.verify.outputs.is_release == 'true'
        with:
          app-token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      - name: Read version from gemspec(s) and verify sync
        id: version
        if: steps.verify.outputs.is_release == 'true'
        env:
          GEM_SPECS: ${{ inputs.gem_specs }}
        run: |
          set -euo pipefail
          REFERENCE=""
          GEM_NAMES=""
          while IFS= read -r line; do
            line="$(echo "$line" | xargs)"
            [ -z "$line" ] && continue
            GEM_NAME="${line%%:*}"
            if [ ! -f "${GEM_NAME}.gemspec" ]; then
              echo "::error::Gemspec not found: ${GEM_NAME}.gemspec"
              exit 1
            fi
            CURRENT=$(ruby -e "puts Gem::Specification.load('${GEM_NAME}.gemspec').version")
            if [ -z "$REFERENCE" ]; then
              REFERENCE="$CURRENT"
            elif [ "$CURRENT" != "$REFERENCE" ]; then
              echo "::error::Version mismatch: ${GEM_NAME} = ${CURRENT}, expected ${REFERENCE}"
              exit 1
            fi
            GEM_NAMES="${GEM_NAMES}${GEM_NAME} "
          done <<< "$GEM_SPECS"
          if [ -z "$REFERENCE" ]; then
            echo "::error::No gem_specs provided."
            exit 1
          fi
          echo "tag=v${REFERENCE}" >> "$GITHUB_OUTPUT"
          echo "gem_names=${GEM_NAMES}" >> "$GITHUB_OUTPUT"

      - uses: fluence-eu/ci-workflows/actions/tag-and-release@v5
        id: tag
        if: steps.verify.outputs.is_release == 'true'
        with:
          tag: ${{ steps.version.outputs.tag }}
          notes-source: changelog
          changelog-path: CHANGELOG.md
          app-token: ${{ steps.app-token.outputs.token }}

      - name: Build and attach gems
        if: steps.verify.outputs.is_release == 'true' && steps.tag.outputs.skipped == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.version.outputs.tag }}
          GEM_NAMES: ${{ steps.version.outputs.gem_names }}
        run: |
          set -euo pipefail
          for GEM_NAME in $GEM_NAMES; do
            gem build "${GEM_NAME}.gemspec"
            gh release upload "$TAG" "${GEM_NAME}"-*.gem --clobber
          done
