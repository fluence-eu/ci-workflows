name: Ruby Gem — Prepare Release PR

on:
  workflow_call:
    inputs:
      gem_name:
        description: Gem name (for PR title)
        required: true
        type: string
      version_file:
        description: Path to the Ruby file containing `VERSION = '...'`
        required: true
        type: string
      bump:
        description: Version bump type (patch|minor|major)
        required: true
        type: string
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        description: Private key of the GitHub App that opens the release PR
        required: true

jobs:
  prepare:
    name: Prepare Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git as the release app
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          BOT_USER="${APP_SLUG}[bot]"
          BOT_ID=$(gh api "/users/${BOT_USER}" --jq .id)
          git config user.name "${BOT_USER}"
          git config user.email "${BOT_ID}+${BOT_USER}@users.noreply.github.com"

      - name: Bump version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          VERSION_FILE: ${{ inputs.version_file }}
          GEM_NAME: ${{ inputs.gem_name }}
        run: |
          set -euo pipefail
          CURRENT=$(ruby -e "puts Gem::Specification.load('${GEM_NAME}.gemspec').version")
          if [[ -z "$CURRENT" ]]; then
            echo "ERROR: Could not load version from ${GEM_NAME}.gemspec" >&2
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$BUMP" in
            patch) PATCH=$((PATCH + 1)) ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            *) echo "ERROR: Invalid bump type '$BUMP'. Use patch, minor, or major." >&2; exit 1 ;;
          esac
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Bumping version: $CURRENT -> $NEW_VERSION"
          sed -i.bak "s/VERSION = '$CURRENT'/VERSION = '$NEW_VERSION'/" "$VERSION_FILE"
          rm -f "$VERSION_FILE.bak"
          if ! grep -q "VERSION = '$NEW_VERSION'" "$VERSION_FILE"; then
            echo "ERROR: version bump did not take effect on $VERSION_FILE" >&2
            exit 1
          fi
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ steps.bump.outputs.tag }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BRANCH="release/${{ steps.bump.outputs.tag }}"
          git checkout -b "$BRANCH"
          git add ${{ inputs.version_file }} CHANGELOG.md
          git commit -m "release: ${{ steps.bump.outputs.tag }}"
          git push origin "$BRANCH"
          gh pr create \
            --title "release: ${{ steps.bump.outputs.tag }}" \
            --body "Bump ${{ inputs.gem_name }} to ${{ steps.bump.outputs.version }} and update changelog." \
            --base main \
            --head "$BRANCH"
