name: Ruby Gem — Prepare Release PR

# Bumps the version constant(s) in one or more Ruby gems, regenerates
# CHANGELOG.md from conventional commits, opens an auto-merged PR.
# Companion to ruby-gem-release.yml: the auto-merged "release: vX"
# commit fires the release pipeline.
#
# Mono-gem: pass `gem_specs: fluence-gateway-auth` (single line).
# Multi-gem: pass a multiline list. All gems are bumped to the SAME
# version — their current versions must already match.
#
# Version file is auto-derived from the gem name via the Bundler
# default convention:
#
#   fluence-gateway-auth  →  lib/fluence/gateway/auth/version.rb
#
# Override on a per-gem basis when the convention does not hold:
#
#   gem_specs: |
#     fluence-foo
#     fluence-weirdo:lib/non/standard/v.rb

on:
  workflow_call:
    inputs:
      gem_specs:
        description: 'Newline-separated list of gem names (without .gemspec). Optional ":path/to/version.rb" override per line.'
        required: true
        type: string
      bump:
        description: "Version bump type (patch|minor|major)"
        required: true
        type: string
      ruby_version:
        description: "Ruby version for the runner"
        required: false
        type: string
        default: "4.0"
    secrets:
      FLUENCE_RELEASE_BOT_PRIVATE_KEY:
        description: Private key of the GitHub App that opens + auto-merges the release PR
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - id: app-token
        uses: fluence-eu/ci-workflows/actions/release-app-token@v5
        with:
          client-id: ${{ vars.FLUENCE_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLUENCE_RELEASE_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: fluence-eu/ci-workflows/actions/setup-release-bot-git@v5
        with:
          app-token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby_version }}

      - name: Bump version across all gems (in sync)
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          GEM_SPECS: ${{ inputs.gem_specs }}
        run: |
          set -euo pipefail

          # First pass: parse gem_specs, derive version_files, verify
          # every current version is identical (otherwise a multi-gem
          # release would be ambiguous).
          declare -a GEMS=() FILES=()
          REFERENCE=""
          while IFS= read -r line; do
            line="$(echo "$line" | xargs)"  # trim
            [ -z "$line" ] && continue

            if [[ "$line" == *:* ]]; then
              GEM_NAME="${line%%:*}"
              VERSION_FILE="${line#*:}"
            else
              GEM_NAME="$line"
              # Bundler default convention: lib/<gem name with - as />/version.rb
              VERSION_FILE="lib/$(echo "$GEM_NAME" | tr '-' '/')/version.rb"
            fi

            if [ ! -f "${GEM_NAME}.gemspec" ]; then
              echo "::error::Gemspec not found: ${GEM_NAME}.gemspec"
              exit 1
            fi
            if [ ! -f "$VERSION_FILE" ]; then
              echo "::error::version file not found: ${VERSION_FILE} (derived for ${GEM_NAME})"
              exit 1
            fi

            CURRENT=$(ruby -e "puts Gem::Specification.load('${GEM_NAME}.gemspec').version")
            if [ -z "$REFERENCE" ]; then
              REFERENCE="$CURRENT"
            elif [ "$CURRENT" != "$REFERENCE" ]; then
              echo "::error::Version mismatch: ${GEM_NAME} = ${CURRENT}, expected ${REFERENCE}. Multi-gem releases require synced versions."
              exit 1
            fi

            GEMS+=("$GEM_NAME")
            FILES+=("$VERSION_FILE")
          done <<< "$GEM_SPECS"

          if [ "${#GEMS[@]}" -eq 0 ]; then
            echo "::error::No gem_specs provided."
            exit 1
          fi

          # Compute the new version once from the shared current.
          IFS='.' read -r MAJOR MINOR PATCH <<< "$REFERENCE"
          case "$BUMP" in
            patch) PATCH=$((PATCH + 1)) ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            *) echo "::error::Invalid bump type '$BUMP'. Use patch, minor, or major." ; exit 1 ;;
          esac
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Bumping ${#GEMS[@]} gem(s) from ${REFERENCE} → ${NEW_VERSION}"

          # Second pass: rewrite each VERSION constant.
          for i in "${!GEMS[@]}"; do
            FILE="${FILES[$i]}"
            sed -i.bak "s/VERSION = '${REFERENCE}'/VERSION = '${NEW_VERSION}'/" "$FILE"
            rm -f "${FILE}.bak"
            if ! grep -q "VERSION = '${NEW_VERSION}'" "$FILE"; then
              echo "::error::Version bump did not apply to ${FILE}"
              exit 1
            fi
          done

          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          # Persist resolved version file list for the next steps.
          {
            echo 'version_files<<EOF'
            printf '%s\n' "${FILES[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ steps.bump.outputs.tag }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release branch + push
        id: branch
        env:
          TAG: ${{ steps.bump.outputs.tag }}
          VERSION_FILES: ${{ steps.bump.outputs.version_files }}
        run: |
          set -euo pipefail
          BRANCH="release/${TAG}"
          git checkout -b "$BRANCH"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            git add "$f"
          done <<< "$VERSION_FILES"
          [ -f CHANGELOG.md ] && git add CHANGELOG.md
          git commit -m "release: ${TAG}"
          git push -u origin "$BRANCH"

      - name: Create release PR
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.bump.outputs.tag }}
          VERSION: ${{ steps.bump.outputs.version }}
          GEM_SPECS: ${{ inputs.gem_specs }}
        run: |
          set -euo pipefail
          GEM_LIST=$(while IFS= read -r line; do
            line="$(echo "$line" | xargs)"
            [ -z "$line" ] && continue
            name="${line%%:*}"
            printf -- '- `%s` → `v%s`\n' "$name" "$VERSION"
          done <<< "$GEM_SPECS")
          BODY=$(printf 'Version bump for Ruby gem(s):\n\n%s\n\nAuto-merged once required checks pass.' "$GEM_LIST")
          PR_URL=$(gh pr create \
            --base main \
            --title "release: ${TAG}" \
            --body "$BODY")
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - uses: fluence-eu/ci-workflows/actions/automerge-pr-with-retry@v5
        with:
          pr-url: ${{ steps.pr.outputs.url }}
          app-token: ${{ steps.app-token.outputs.token }}
