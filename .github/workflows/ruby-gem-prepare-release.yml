name: Ruby Gem — Prepare Release PR

# Bumps the version constant(s) in one or more Ruby gems, regenerates
# CHANGELOG.md from conventional commits, opens an auto-merged PR.
# Companion to ruby-gem-release.yml: the auto-merged "release: vX"
# commit fires the release pipeline.
#
# Gem names come from the consumer's `.fluence-ci.yml` under
# `release.gem_specs`. Mono-gem: a single name. Multi-gem: a multiline
# list. All gems are bumped to the SAME version — their current
# versions must already match.
#
# Version file is auto-derived from the gem name via the Bundler
# default convention:
#
#   fluence-gateway-auth  →  lib/fluence/gateway/auth/version.rb
#
# Override on a per-gem basis when the convention does not hold:
#
#   release:
#     gem_specs: |
#       fluence-foo
#       fluence-weirdo:lib/non/standard/v.rb
#
# Dated releases with a hand-written changelog, as on the app-* family:
#
#   release:
#     version: date       # UTC stamp in `release.tag_format`, `bump` unused
#     changelog: manual   # date the `## [Unreleased]` section, no git-cliff

on:
  workflow_call:
    inputs:
      bump:
        description: "Version bump type (patch|minor|major). Unused when `release.version` is `date`."
        required: false
        default: ''
        type: string
    secrets:
      FLUENCE_RELEASE_BOT_PRIVATE_KEY:
        description: Private key of the GitHub App that opens + auto-merges the release PR
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - id: app-token
        uses: fluence-eu/ci-workflows/actions/release-app-token@v6
        with:
          client-id: ${{ vars.FLUENCE_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLUENCE_RELEASE_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Read .fluence-ci.yml
        id: cfg
        uses: fluence-eu/ci-workflows/actions/read-config@v6
        with:
          keys: |
            gem_specs=release.gem_specs=
            version_scheme=release.version=semver
            changelog=release.changelog=git-cliff
            tag_format=release.tag_format=%Y.%m.%d.%H%M%S
          required: gem_specs

      - uses: fluence-eu/ci-workflows/actions/setup-release-bot-git@v6
        with:
          app-token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      - name: Resolve Ruby version
        id: ruby
        uses: fluence-eu/ci-workflows/actions/resolve-version@v6
        with:
          runtime: ruby

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ steps.ruby.outputs.version }}

      - name: Resolve release options
        id: options
        env:
          VERSION_SCHEME: ${{ fromJSON(steps.cfg.outputs.values).version_scheme }}
          CHANGELOG: ${{ fromJSON(steps.cfg.outputs.values).changelog }}
          TAG_FORMAT: ${{ fromJSON(steps.cfg.outputs.values).tag_format }}
        run: |
          set -euo pipefail
          NOW=$(date -u +%s)
          case "$VERSION_SCHEME" in
            semver) ;;
            date) echo "version=$(date -u -d "@$NOW" +"$TAG_FORMAT")" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Invalid release.version '$VERSION_SCHEME'. Use semver or date." ; exit 1 ;;
          esac
          case "$CHANGELOG" in
            git-cliff|manual) ;;
            *) echo "::error::Invalid release.changelog '$CHANGELOG'. Use git-cliff or manual." ; exit 1 ;;
          esac
          echo "date=$(date -u -d "@$NOW" +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - id: bump
        uses: fluence-eu/ci-workflows/actions/bump-ruby-gem-versions@v6
        with:
          bump: ${{ inputs.bump }}
          version: ${{ steps.options.outputs.version }}
          gem-specs: ${{ fromJSON(steps.cfg.outputs.values).gem_specs }}

      - name: Generate changelog
        if: fromJSON(steps.cfg.outputs.values).changelog == 'git-cliff'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ steps.bump.outputs.tag }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Date the Unreleased changelog section
        if: fromJSON(steps.cfg.outputs.values).changelog == 'manual'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          RELEASE_DATE: ${{ steps.options.outputs.date }}
        run: |
          ruby -e '
            fail_with = ->(message) { puts "::error::#{message}"; exit 1 }
            fail_with.("CHANGELOG.md not found") unless File.exist?("CHANGELOG.md")
            text = File.read("CHANGELOG.md")
            section = text[/^## \[Unreleased\][^\n]*(?:\n|\z)(.*?)(?=^## \[|\z)/m, 1]
            fail_with.("CHANGELOG.md has no ## [Unreleased] section") unless section
            fail_with.("The ## [Unreleased] section of CHANGELOG.md is empty") if section.strip.empty?
            File.write("CHANGELOG.md", text.sub(/^## \[Unreleased\][^\n]*/, "## [#{ENV["VERSION"]}] - #{ENV["RELEASE_DATE"]}"))
          '

      - uses: fluence-eu/ci-workflows/actions/commit-release-branch@v6
        with:
          tag: ${{ steps.bump.outputs.tag }}
          files-to-stage: |
            ${{ steps.bump.outputs.version_files }}
            CHANGELOG.md

      - name: Create release PR
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.bump.outputs.tag }}
          VERSION: ${{ steps.bump.outputs.version }}
          GEM_SPECS: ${{ fromJSON(steps.cfg.outputs.values).gem_specs }}
        run: |
          set -euo pipefail
          GEM_LIST=$(while IFS= read -r line; do
            line="$(echo "$line" | xargs)"
            [ -z "$line" ] && continue
            name="${line%%:*}"
            printf -- '- `%s` → `v%s`\n' "$name" "$VERSION"
          done <<< "$GEM_SPECS")
          BODY=$(printf 'Version bump for Ruby gem(s):\n\n%s\n\nAuto-merged once required checks pass.' "$GEM_LIST")
          PR_URL=$(gh pr create \
            --base main \
            --title "release: ${TAG}" \
            --body "$BODY")
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - uses: fluence-eu/ci-workflows/actions/automerge-pr-with-retry@v6
        with:
          pr-url: ${{ steps.pr.outputs.url }}
          app-token: ${{ steps.app-token.outputs.token }}
