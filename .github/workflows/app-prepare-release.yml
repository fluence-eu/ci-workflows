name: App — Prepare Release PR

# Triggered by consumer via workflow_dispatch. Generates a timestamp
# tag, runs git-cliff to prepend the changelog, opens an auto-merged
# PR on the working branch (default `develop`).
#
# Companion to app-release.yml: the auto-merged PR squash-commits
# "release: vX" and touches CHANGELOG.md. The consumer's release.yml
# thin caller uses a paths filter on CHANGELOG.md to trigger
# app-release.yml in response — zero ghost runs, zero `if:` guards.
#
# Pattern target: rolling-release apps where `develop` is the working
# branch and `main` is kept as a force-pushed mirror of the latest
# released state. For semver-published gems, use ruby-gem-* reusables
# instead.

on:
  workflow_call:
    secrets:
      FLUENCE_RELEASE_BOT_PRIVATE_KEY:
        description: Private key of the GitHub App that opens + auto-merges the release PR.
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare changelog PR
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - id: app-token
        uses: fluence-eu/ci-workflows/actions/release-app-token@v6
        with:
          client-id: ${{ vars.FLUENCE_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLUENCE_RELEASE_BOT_PRIVATE_KEY }}

      # Checks out the triggering ref — the consumer dispatches this from
      # its working branch, which is also where .fluence-ci.yml is read.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Read .fluence-ci.yml
        id: cfg
        uses: fluence-eu/ci-workflows/actions/read-config@v6
        with:
          keys: |
            develop_branch=release.develop_branch=develop
            tag_format=release.tag_format=%Y.%m.%d.%H%M%S

      - uses: fluence-eu/ci-workflows/actions/setup-release-bot-git@v6
        with:
          app-token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      - name: Generate tag
        id: version
        env:
          TAG_FORMAT: ${{ fromJSON(steps.cfg.outputs.values).tag_format }}
        run: echo "tag=v$(date -u +"$TAG_FORMAT")" >> "$GITHUB_OUTPUT"

      - name: Initialize changelog if missing
        run: |
          if [ ! -f CHANGELOG.md ]; then
            printf "# Changelog\n\nAll notable changes to this project will be documented in this file.\n" > CHANGELOG.md
          fi

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --tag ${{ steps.version.outputs.tag }} --prepend CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain -- CHANGELOG.md)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release branch + PR
        if: steps.diff.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.version.outputs.tag }}
          BASE: ${{ fromJSON(steps.cfg.outputs.values).develop_branch }}
        run: |
          BRANCH="release/${TAG}"
          git checkout -b "$BRANCH"
          git add CHANGELOG.md
          git commit -m "release: ${TAG}"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create \
            --title "release: ${TAG}" \
            --body "Update changelog for release ${TAG}. Auto-merged once required checks pass." \
            --base "$BASE" \
            --head "$BRANCH")
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - uses: fluence-eu/ci-workflows/actions/automerge-pr-with-retry@v6
        if: steps.diff.outputs.changed == 'true'
        with:
          pr-url: ${{ steps.pr.outputs.url }}
          app-token: ${{ steps.app-token.outputs.token }}
