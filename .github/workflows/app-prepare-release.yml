name: App — Prepare Release PR

# Triggered by consumer via workflow_dispatch. Generates a timestamp
# tag, runs git-cliff to prepend the changelog, opens an auto-merged
# PR on the working branch (default `develop`).
#
# Companion to app-release.yml: the auto-merged PR squash-commits
# "release: vX" and touches CHANGELOG.md. The consumer's release.yml
# thin caller uses a paths filter on CHANGELOG.md to trigger
# app-release.yml in response — zero ghost runs, zero `if:` guards.
#
# Pattern target: rolling-release apps where `develop` is the working
# branch and `main` is kept as a force-pushed mirror of the latest
# released state. For semver-published gems, use ruby-gem-* reusables
# instead.

on:
  workflow_call:
    inputs:
      develop_branch:
        description: Working branch to release from.
        required: false
        type: string
        default: 'develop'
      tag_format:
        description: UTC date format for the generated tag (passed to `date -u +…`).
        required: false
        type: string
        default: '%Y.%m.%d.%H%M%S'
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        description: Private key of the GitHub App that opens + auto-merges the release PR.
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare changelog PR
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - id: app-token
        uses: fluence-eu/ci-workflows/actions/release-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.develop_branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git as the release app
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          BOT_USER="${APP_SLUG}[bot]"
          BOT_ID=$(gh api "/users/${BOT_USER}" --jq .id)
          git config user.name "${BOT_USER}"
          git config user.email "${BOT_ID}+${BOT_USER}@users.noreply.github.com"

      - name: Generate tag
        id: version
        env:
          TAG_FORMAT: ${{ inputs.tag_format }}
        run: echo "tag=v$(date -u +"$TAG_FORMAT")" >> "$GITHUB_OUTPUT"

      - name: Initialize changelog if missing
        run: |
          if [ ! -f CHANGELOG.md ]; then
            printf "# Changelog\n\nAll notable changes to this project will be documented in this file.\n" > CHANGELOG.md
          fi

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --tag ${{ steps.version.outputs.tag }} --prepend CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain -- CHANGELOG.md)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and auto-merge changelog PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.version.outputs.tag }}
          BASE: ${{ inputs.develop_branch }}
        run: |
          BRANCH="release/${TAG}"
          git checkout -b "$BRANCH"
          git add CHANGELOG.md
          git commit -m "release: ${TAG}"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create \
            --title "release: ${TAG}" \
            --body "Update changelog for release ${TAG}. Auto-merged once required checks pass." \
            --base "$BASE" \
            --head "$BRANCH")
          gh pr merge "$PR_URL" --auto --squash --delete-branch
