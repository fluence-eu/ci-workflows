name: Ruby Gem — Publish to GitHub Packages

# Publishes already-built gems to GitHub Packages. Every .gem asset is
# downloaded from the release (attached by ruby-gem-release.yml) rather
# than rebuilt, so what's shipped to the registry is bit-for-bit the
# same binary as what's pinned to the GitHub Release. Multi-gem repos
# release all their gems under one tag, so publishing every asset is
# the whole set by construction. Symmetric with npm-publish.yml.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag to publish. Optional when called from `on: release` (the event provides it); required when the consumer wrapper is dispatched manually.'
        required: false
        type: string
        default: ''

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="${INPUT_TAG:-$EVENT_TAG}"
          if [[ -z "$TAG" ]]; then
            echo "ERROR: no tag provided via inputs and no release event context available." >&2
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Resolve Ruby version
        id: ruby
        uses: fluence-eu/ci-workflows/actions/resolve-version@v6
        with:
          runtime: ruby

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ steps.ruby.outputs.version }}

      - name: Download gem assets from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # ruby-gem-release.yml attaches the gems before publishing the
          # Release, so they are normally present when this fires. The
          # retry only absorbs GitHub's brief asset-availability lag (an
          # attached asset can take a moment to be downloadable). The `if`
          # guard keeps the loop alive under `set -e`.
          for attempt in 1 2 3 4 5; do
            if gh release download "$TAG" \
                 --repo "$GITHUB_REPOSITORY" \
                 --pattern "*.gem" \
                 --clobber; then
              exit 0
            fi
            echo "download attempt ${attempt}/5 failed, retrying in 3s..."
            sleep 3
          done
          echo "::error::Could not download *.gem from release ${TAG} after 5 attempts"
          exit 1

      - name: Configure gem credentials
        env:
          # Passing through env avoids expression interpolation into
          # the shell command line and keeps the token out of any
          # transient process argv.
          GEM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.gem
          cat > ~/.gem/credentials << EOF
          ---
          :github: Bearer ${GEM_TOKEN}
          EOF
          chmod 0600 ~/.gem/credentials

      - name: Push every downloaded gem to GitHub Packages
        run: |
          set -euo pipefail
          shopt -s nullglob
          gems=(*.gem)
          if [ "${#gems[@]}" -eq 0 ]; then
            echo "::error::No .gem asset found on the release"
            exit 1
          fi
          for gem in "${gems[@]}"; do
            echo "Publishing ${gem}"
            gem push --key github --host https://rubygems.pkg.github.com/fluence-eu "$gem"
          done
