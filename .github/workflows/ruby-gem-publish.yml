name: Ruby Gem — Publish to GitHub Packages

# Publishes an already-built gem to GitHub Packages. The gem is
# downloaded from the release assets (attached by ruby-gem-release.yml)
# rather than rebuilt, so what's shipped to the registry is bit-for-bit
# the same binary as what's pinned to the GitHub Release.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag to publish. Optional when called from `on: release` (the event provides it); required when the consumer wrapper is dispatched manually.'
        required: false
        type: string
        default: ''

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Read .fluence-ci.yml
        id: cfg
        uses: fluence-eu/ci-workflows/actions/read-config@v6
        with:
          keys: |
            ruby_version=ruby_version=4.0
            gem_name=release.gem_name=
          required: gem_name

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="${INPUT_TAG:-$EVENT_TAG}"
          if [[ -z "$TAG" ]]; then
            echo "ERROR: no tag provided via inputs and no release event context available." >&2
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ fromJSON(steps.cfg.outputs.values).ruby_version }}

      - name: Download gem asset from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          GEM_NAME: ${{ fromJSON(steps.cfg.outputs.values).gem_name }}
        run: |
          # ruby-gem-release.yml attaches the gem before publishing the
          # Release, so it is normally present when this fires. The retry
          # only absorbs GitHub's brief asset-availability lag (an attached
          # asset can take a moment to be downloadable). The `if` guard
          # keeps the loop alive under `set -e`.
          for attempt in 1 2 3 4 5; do
            if gh release download "$TAG" \
                 --repo "$GITHUB_REPOSITORY" \
                 --pattern "${GEM_NAME}-*.gem" \
                 --clobber; then
              exit 0
            fi
            echo "download attempt ${attempt}/5 failed, retrying in 3s..."
            sleep 3
          done
          echo "::error::Could not download ${GEM_NAME}-*.gem from release ${TAG} after 5 attempts"
          exit 1

      - name: Configure gem credentials
        env:
          # Passing through env avoids expression interpolation into
          # the shell command line and keeps the token out of any
          # transient process argv.
          GEM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.gem
          cat > ~/.gem/credentials << EOF
          ---
          :github: Bearer ${GEM_TOKEN}
          EOF
          chmod 0600 ~/.gem/credentials

      - name: Push gem to GitHub Packages
        env:
          GEM_NAME: ${{ fromJSON(steps.cfg.outputs.values).gem_name }}
        run: gem push --key github --host https://rubygems.pkg.github.com/fluence-eu "${GEM_NAME}"-*.gem
