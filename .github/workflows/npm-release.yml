name: NPM — Release

# Triggered by consumer via push to main with a paths filter on the
# tracked package.json (single or first multi-package entry). Verifies
# the commit was authored by the release bot, reads the version from
# package.json, then delegates to the tag-and-release composite.
#
# Companion to npm-prepare-release.yml: that workflow auto-merges a
# "release: vX" commit touching package.json, which is what fires
# this workflow.
#
# After tagging, builds each package and attaches the resulting `.tgz`
# tarballs to the GitHub Release. The Release is created as a draft and
# only flipped to published once the tarballs are attached, so the
# `release: published` event that triggers npm-publish.yml never fires
# before the assets exist. Symmetric with ruby-gem-release.yml
# (`gem build` + `gh release upload .gem`). The companion
# `npm-publish.yml` then downloads those tarballs and `npm publish`-es
# them — guarantees the published artifact is byte-identical to what
# is attached to the Release.
#
# Pattern target: npm packages on GitHub Packages (or any registry
# the consumer wires up downstream via the published release event).

on:
  workflow_call:
    secrets:
      FLUENCE_RELEASE_BOT_PRIVATE_KEY:
        description: Private key of the GitHub App. Used to verify the release author and to emit the release-published event that triggers downstream publish workflows.
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - id: app-token
        uses: fluence-eu/ci-workflows/actions/release-app-token@v6
        with:
          client-id: ${{ vars.FLUENCE_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLUENCE_RELEASE_BOT_PRIVATE_KEY }}

      - id: verify
        uses: fluence-eu/ci-workflows/actions/verify-release-author@v6
        with:
          app-slug: ${{ steps.app-token.outputs.app-slug }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v7
        if: steps.verify.outputs.is_release == 'true'
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Read .fluence-ci.yml
        id: cfg
        if: steps.verify.outputs.is_release == 'true'
        uses: fluence-eu/ci-workflows/actions/read-config@v6
        with:
          keys: |
            package_paths=release.package_paths=package.json
            notes_source=release.notes_source=changelog
            changelog_path=release.changelog_path=CHANGELOG.md
            notes_file=release.notes_file=
            build_command=release.build_command=npm run build --workspaces

      - uses: fluence-eu/ci-workflows/actions/setup-release-bot-git@v6
        if: steps.verify.outputs.is_release == 'true'
        with:
          app-token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      - id: version
        if: steps.verify.outputs.is_release == 'true'
        uses: fluence-eu/ci-workflows/actions/read-and-verify-npm-versions@v6
        with:
          package-paths: ${{ fromJSON(steps.cfg.outputs.values).package_paths }}

      - uses: fluence-eu/ci-workflows/actions/tag-and-release@v6
        if: steps.verify.outputs.is_release == 'true'
        with:
          tag: ${{ steps.version.outputs.tag }}
          notes-source: ${{ fromJSON(steps.cfg.outputs.values).notes_source }}
          changelog-path: ${{ fromJSON(steps.cfg.outputs.values).changelog_path }}
          notes-file: ${{ fromJSON(steps.cfg.outputs.values).notes_file }}
          app-token: ${{ steps.app-token.outputs.token }}
          # Create the Release as a draft so `release: published` does not
          # fire before the tarballs are attached below. The "Publish the
          # release" step flips it once the assets are in place.
          draft: true

      - name: Resolve Node version
        id: node
        if: steps.verify.outputs.is_release == 'true'
        uses: fluence-eu/ci-workflows/actions/resolve-version@v6
        with:
          runtime: node
          default: '22'

      - uses: actions/setup-node@v6
        if: steps.verify.outputs.is_release == 'true'
        with:
          node-version: ${{ steps.node.outputs.version }}

      - name: Install dependencies and build
        if: steps.verify.outputs.is_release == 'true'
        env:
          BUILD_CMD: ${{ fromJSON(steps.cfg.outputs.values).build_command }}
        run: |
          npm ci
          eval "$BUILD_CMD"

      - name: Pack and attach tarballs to the release
        if: steps.verify.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PACKAGE_PATHS: ${{ fromJSON(steps.cfg.outputs.values).package_paths }}
        run: |
          set -euo pipefail
          while IFS= read -r pkg; do
            pkg="$(echo "$pkg" | xargs)"
            [ -z "$pkg" ] && continue
            dir="$(dirname "$pkg")"
            # `npm pack --workspace <dir>` produces a tarball using the
            # workspace's own `files` field, name, and version — exactly
            # what `npm publish` would upload to the registry.
            (cd "$dir" && npm pack --pack-destination "$GITHUB_WORKSPACE")
          done <<< "$PACKAGE_PATHS"
          # Upload every .tgz that npm pack just created. --clobber so a
          # re-run of the release workflow overwrites the existing asset
          # rather than failing on "asset already exists".
          gh release upload "$TAG" *.tgz --clobber

      - name: Publish the release (now that tarballs are attached)
        if: steps.verify.outputs.is_release == 'true'
        env:
          # App token so the resulting `release: published` event can
          # trigger downstream workflows (npm-publish.yml). The release
          # was created as a draft by tag-and-release; flipping it to
          # published now fires the event with the .tgz assets already
          # in place, so npm-publish.yml downloads them without racing
          # the upload. Idempotent: a no-op if already published.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
