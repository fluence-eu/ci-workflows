name: NPM — Release

# Triggered by consumer via push to main with a paths filter on the
# tracked package.json (single or first multi-package entry). Verifies
# the commit was authored by the release bot, reads the version from
# package.json, then delegates to the tag-and-release composite.
#
# Companion to npm-prepare-release.yml: that workflow auto-merges a
# "release: vX" commit touching package.json, which is what fires
# this workflow.
#
# After tagging, builds each package and attaches the resulting `.tgz`
# tarballs to the GitHub Release. Symmetric with ruby-gem-release.yml
# (`gem build` + `gh release upload .gem`). The companion
# `npm-publish.yml` then downloads those tarballs and `npm publish`-es
# them — guarantees the published artifact is byte-identical to what
# is attached to the Release.
#
# Pattern target: npm packages on GitHub Packages (or any registry
# the consumer wires up downstream via the published release event).

on:
  workflow_call:
    inputs:
      package_paths:
        description: "Newline-separated list of package.json paths to read the version from. The first one is the source of truth; the others must match (else fail). Defaults to a mono-repo single root package.json."
        required: false
        type: string
        default: |
          package.json
      notes_source:
        description: "Release notes source forwarded to tag-and-release: 'auto' | 'changelog' | 'file'. Defaults to 'changelog' (npm-prepare-release.yml runs git-cliff and commits CHANGELOG.md alongside the bump)."
        required: false
        type: string
        default: changelog
      changelog_path:
        description: "Path to CHANGELOG.md when notes_source is 'changelog'."
        required: false
        type: string
        default: CHANGELOG.md
      notes_file:
        description: "Path to a pre-written notes file when notes_source is 'file'."
        required: false
        type: string
        default: ""
      node_version:
        description: "Node version used to build the tarballs attached to the Release."
        required: false
        type: string
        default: "22"
      build_command:
        description: "Command used to produce the dist/ output of each workspace before `npm pack`. Defaults to the workspace-aware build."
        required: false
        type: string
        default: "npm run build --workspaces"
    secrets:
      FLUENCE_RELEASE_BOT_PRIVATE_KEY:
        description: Private key of the GitHub App. Used to verify the release author and to emit the release-published event that triggers downstream publish workflows.
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - id: app-token
        uses: fluence-eu/ci-workflows/actions/release-app-token@v5
        with:
          client-id: ${{ vars.FLUENCE_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLUENCE_RELEASE_BOT_PRIVATE_KEY }}

      - id: verify
        uses: fluence-eu/ci-workflows/actions/verify-release-author@v5
        with:
          app-slug: ${{ steps.app-token.outputs.app-slug }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v6
        if: steps.verify.outputs.is_release == 'true'
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: fluence-eu/ci-workflows/actions/setup-release-bot-git@v5
        if: steps.verify.outputs.is_release == 'true'
        with:
          app-token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      - id: version
        if: steps.verify.outputs.is_release == 'true'
        uses: fluence-eu/ci-workflows/actions/read-and-verify-npm-versions@v5
        with:
          package-paths: ${{ inputs.package_paths }}

      - uses: fluence-eu/ci-workflows/actions/tag-and-release@v5
        if: steps.verify.outputs.is_release == 'true'
        with:
          tag: ${{ steps.version.outputs.tag }}
          notes-source: ${{ inputs.notes_source }}
          changelog-path: ${{ inputs.changelog_path }}
          notes-file: ${{ inputs.notes_file }}
          app-token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v6
        if: steps.verify.outputs.is_release == 'true'
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install dependencies and build
        if: steps.verify.outputs.is_release == 'true'
        env:
          BUILD_CMD: ${{ inputs.build_command }}
        run: |
          npm ci
          eval "$BUILD_CMD"

      - name: Pack and attach tarballs to the release
        if: steps.verify.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PACKAGE_PATHS: ${{ inputs.package_paths }}
        run: |
          set -euo pipefail
          while IFS= read -r pkg; do
            pkg="$(echo "$pkg" | xargs)"
            [ -z "$pkg" ] && continue
            dir="$(dirname "$pkg")"
            # `npm pack --workspace <dir>` produces a tarball using the
            # workspace's own `files` field, name, and version — exactly
            # what `npm publish` would upload to the registry.
            (cd "$dir" && npm pack --pack-destination "$GITHUB_WORKSPACE")
          done <<< "$PACKAGE_PATHS"
          # Upload every .tgz that npm pack just created. --clobber so a
          # re-run of the release workflow overwrites the existing asset
          # rather than failing on "asset already exists".
          gh release upload "$TAG" *.tgz --clobber
