name: Claude — PR Review

# Runs on pull requests. Delegates the review to anthropics/claude-code-action,
# authenticated via a Pro/Max OAuth token (CLAUDE_CODE_OAUTH_TOKEN) so the run
# bills against the subscription quota instead of metered API credits.
#
# The action posts a single sticky summary comment plus inline review comments
# on the lines it flags. Release PRs (head_ref `release/v*` authored by the
# release App) are skipped to keep the auto-merge path clean and avoid burning
# review budget on mechanical changelog/version bumps.

on:
  workflow_call:
    inputs:
      claude_args:
        description: |
          Additional CLI args forwarded to Claude Code. Default whitelists
          the GitHub commenting tools (without it, Claude tries to call
          them, gets denied and loops until --max-turns runs out — see
          permission_denials_count in the SDK output). The turn budget is
          set separately via the `max_turns` input. `gh api` is included
          so the re-review protocol can read prior inline-comment threads
          and the commit-range compare endpoint. Override only if you
          need a different model or extra tools — and remember to keep
          the comment whitelist (and `gh api`) or Claude will go silent.
          Reference: anthropics/claude-code-action examples/pr-review-comprehensive.yml
        required: false
        type: string
        default: |
          --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*)"
      max_turns:
        description: |
          Upper bound on the number of agent turns Claude is allowed to
          spend on the review. `60` is the default — sized so an
          exhaustive first pass (plus the re-review `gh api` calls) does
          not get cut off mid-review; bump to `80`+ for very large diffs
          that still exhaust the budget (look for `subtype:
          error_max_turns` in the SDK output to confirm exhaustion). A
          `--max-turns` flag passed via
          `claude_args` still wins, since claude CLI honours the last
          occurrence — useful for one-off overrides without touching
          this input.
        required: false
        type: number
        default: 60
      prompt:
        description: |
          Override the default review prompt. When omitted, Claude is asked
          to focus on correctness, security, performance, maintainability
          and project conventions, and to leave inline comments for
          specific code issues.
        required: false
        type: string
        default: ''
      checkout_fetch_depth:
        description: |
          Depth used by actions/checkout. `1` (default) is enough for the PR
          diff; bump to `0` if the prompt needs full history (e.g. blame).
        required: false
        type: number
        default: 1
      show_full_output:
        description: |
          Forwarded to anthropics/claude-code-action. When `true`, the
          full SDK output (each tool call, each denial reason, each
          message) is written to the Actions log instead of being
          masked behind 'full output hidden for security'. Useful to
          debug WHY claude consumes turns without posting (e.g. inspect
          permission_denials_count, see exact denied tool names).
          Leave `false` outside of debug — repos privés OK, mais le log
          peut contenir des extraits de code, des noms de chemins, ou
          d'autres details de la PR.
        required: false
        type: boolean
        default: false
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: |
          OAuth token generated locally by `claude setup-token` against a
          Claude Pro or Max subscription. Using this rather than
          `ANTHROPIC_API_KEY` consumes the subscription quota instead of
          metered API credits — make sure no `ANTHROPIC_API_KEY` is also
          forwarded to the runner, otherwise it takes precedence.
        required: true
      FLUENCE_RELEASE_BOT_PRIVATE_KEY:
        description: |
          Optional release App private key. When forwarded, release PRs
          (head_ref `release/v*` authored by the App) skip the review job —
          letting auto-merge proceed without burning Claude budget on
          mechanical changelog/version bumps. When omitted, all PRs run.
        required: false

permissions:
  contents: read

jobs:
  resolve-bot:
    name: Resolve release-bot
    runs-on: ubuntu-latest
    outputs:
      skip_release_pr: ${{ steps.check.outputs.skip }}
    steps:
      - id: token
        uses: fluence-eu/ci-workflows/actions/release-app-token@v7
        with:
          client-id: ${{ vars.FLUENCE_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLUENCE_RELEASE_BOT_PRIVATE_KEY }}
      - id: check
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          SLUG: ${{ steps.token.outputs.app-slug }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Skip when both conditions hold: PR author is the release App
          # AND head ref starts with `release/v`. SLUG is empty when the
          # consumer didn't forward FLUENCE_RELEASE_BOT_PRIVATE_KEY — the empty
          # match makes skip false, preserving the always-run behaviour.
          if [ -n "$SLUG" ] && [ "$AUTHOR" = "${SLUG}[bot]" ] && [[ "$HEAD_REF" == release/v* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release PR detected — skipping Claude review."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  review:
    name: Review
    needs: resolve-bot
    if: needs.resolve-bot.outputs.skip_release_pr == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ inputs.checkout_fetch_depth }}

      - name: Detect MCP-eligible stacks
        id: detect
        run: |
          # Each block emits `<key>=true` to GITHUB_OUTPUT when its stack
          # is present in the consumer repo. Detection must be idempotent
          # and side-effect free. To wire a new stack:
          #   1. Add a detection block here
          #   2. Add a server entry in "Build MCP config" below
          #   3. Add a tool-usage nudge in "Resolve review prompt"
          if [ -f package.json ] && jq -e '.dependencies.vuetify // .devDependencies.vuetify' package.json >/dev/null 2>&1; then
            echo "vuetify=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build MCP config
        id: mcp
        env:
          VUETIFY: ${{ steps.detect.outputs.vuetify }}
        run: |
          # Each detected stack contributes one entry to mcpServers; the
          # additional --allowedTools list is derived from the JSON keys
          # (mcp__<key>__*) so we don't hand-maintain a parallel list.
          # When no stack is detected, `config_path` and `tools` stay
          # empty and the next step skips the augmentation entirely.
          servers='{}'
          if [ "$VUETIFY" = "true" ]; then
            servers=$(jq '. + { vuetify: { type: "http", url: "https://mcp.vuetifyjs.com/mcp" } }' <<< "$servers")
          fi
          if [ "$servers" = "{}" ]; then
            echo "config_path=" >> "$GITHUB_OUTPUT"
            echo "tools="       >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -n --argjson s "$servers" '{ mcpServers: $s }' > "$RUNNER_TEMP/mcp.json"
          tools=$(jq -r 'keys | map("mcp__\(.)__*") | join(",")' <<< "$servers")
          echo "config_path=$RUNNER_TEMP/mcp.json" >> "$GITHUB_OUTPUT"
          echo "tools=$tools"                       >> "$GITHUB_OUTPUT"

      - name: Resolve review prompt
        id: prompt
        env:
          OVERRIDE: ${{ inputs.prompt }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VUETIFY: ${{ steps.detect.outputs.vuetify }}
        run: |
          # Stay injection-safe: user-controllable values (REPO, PR_NUMBER,
          # HEAD_SHA, OVERRIDE) flow through env, never inlined as GH Actions
          # expressions inside the run script. The heredoc terminator is
          # unique enough not to collide with normal prose. `body` is
          # multi-line, so it's emitted with the GH Actions
          # multi-line-output protocol.
          # When the consumer overrides `prompt`, we use it verbatim — they
          # take full responsibility for tool-usage hints. The default-prompt
          # path appends a per-stack nudge so Claude actually invokes the
          # MCP rather than relying on training-data recall.
          if [ -n "$OVERRIDE" ]; then
            {
              echo 'body<<__CLAUDE_REVIEW_EOF__'
              printf '%s\n' "$OVERRIDE"
              echo '__CLAUDE_REVIEW_EOF__'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo 'body<<__CLAUDE_REVIEW_EOF__'
            printf 'REPO: %s\n' "$REPO"
            printf 'PR NUMBER: %s\n' "$PR_NUMBER"
            printf 'HEAD SHA: %s\n\n' "$HEAD_SHA"
            cat <<'PROMPT'
          Please review this pull request. Focus on, in order:

          - Correctness — bugs, off-by-one, missing edge cases, broken
            invariants, error paths that swallow failures.
          - Security — injection, auth/authz gaps, secrets leakage, unsafe
            deserialisation, SSRF, mass-assignment.
          - Performance — N+1 queries, blocking IO on the request path,
            obvious hot loops or accidental O(n^2).
          - Maintainability — naming, dead code, missing tests on new
            behaviour, leaking abstraction.
          - Project conventions — match the surrounding style; do NOT
            suggest churn or refactors outside the PR's scope.

          Scope — read in full, comment incrementally:

          - ALWAYS read the complete PR diff (`gh pr diff`) and the
            surrounding context of every changed file. Understand the PR
            as a whole; never judge a hunk in isolation.
          - Before commenting, find the most recent PR comment containing
            a marker `<!-- claude-review-state: reviewed-sha=<sha> -->`
            (you wrote it in your previous summary). Read your prior
            inline comments and their reply threads via
            `gh api repos/<REPO>/pulls/<PR NUMBER>/comments`.

          First review — no marker found:
          - Be EXHAUSTIVE. Surface every finding across the whole PR in
            this single pass. Never drip-feed: do not hold an issue back
            "for later". A problem on code that later commits will not
            touch must be raised NOW, not after the author has already
            pushed corrections — that drip-feed is the exact failure mode
            this protocol exists to prevent.

          Re-review — a marker exists:
          - Still read the whole PR for context, but only raise findings
            on the changes introduced SINCE the recorded reviewed-sha,
            obtained via
            `gh api repos/<REPO>/compare/<reviewed-sha>...<HEAD SHA>`.
          - Stay completely silent on everything outside that incremental
            set — including your own earlier findings that went
            unresolved. They remain in the PR history; do not repeat them.
          - Respect the discussion. Before raising a point, check whether
            you already raised it and the author replied. If they pushed
            back with a justification, do NOT raise it again — unless you
            have a genuinely new, stronger argument, in which case
            reference the prior thread and state what is new.

          End every summary comment with an updated marker line
          `<!-- claude-review-state: reviewed-sha=<HEAD SHA> -->` using the
          HEAD SHA printed above, so the next run can scope itself.

          Use `mcp__github_inline_comment__create_inline_comment` for
          specific code issues, and `gh pr comment` for the overall
          summary. Keep findings actionable. Skip cosmetic nits unless
          they actually impair readability. ALWAYS post a summary comment
          via `gh pr comment` before finishing — even when the PR is
          clean and you have no findings, post a short acknowledgement
          (e.g. "Review terminée — rien à signaler.") so the absence of
          issues is visible and not confused with a silent or failed run.
          Do not invent concerns just to fill the comment.

          Write the review (summary comment and inline comments) in French.
          PROMPT
            if [ "$VUETIFY" = "true" ]; then
              cat <<'NUDGE'

          Vuetify is used in this repo. The `mcp__vuetify__*` tools give
          you authoritative access to component APIs, prop names, slot
          names, and composable signatures. Before flagging anything
          related to a `<v-*>` component, a `use*` composable, or a
          Vuetify import, call the relevant MCP tool to verify the API
          rather than rely on training-data recall.
          NUDGE
            fi
            echo '__CLAUDE_REVIEW_EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Assemble Claude args
        id: args
        env:
          BASE: ${{ inputs.claude_args }}
          MAX_TURNS: ${{ inputs.max_turns }}
          MCP_PATH: ${{ steps.mcp.outputs.config_path }}
          EXTRA_TOOLS: ${{ steps.mcp.outputs.tools }}
        run: |
          # Prefix --max-turns so the input-controlled budget applies by
          # default, while still letting a caller override it via their
          # own --max-turns inside claude_args (claude CLI takes the last
          # occurrence). Then augment with the per-stack MCP config when
          # at least one stack was detected. claude-code-action already
          # concatenates user claude_args with its own --mcp-config and
          # --allowedTools flags, and claude CLI handles repeated
          # --allowedTools additively (verified against the action's
          # parse-tools tests + tag-mode runtime behaviour), so appending
          # is safe and doesn't clobber the existing GitHub commenting
          # whitelist.
          args="--max-turns $MAX_TURNS $BASE"
          if [ -n "$MCP_PATH" ]; then
            args="$args --mcp-config $MCP_PATH --allowedTools $EXTRA_TOOLS"
          fi
          {
            echo 'value<<__CLAUDE_ARGS_EOF__'
            printf '%s\n' "$args"
            echo '__CLAUDE_ARGS_EOF__'
          } >> "$GITHUB_OUTPUT"

      # A review is advisory — failures inside the action (missing native
      # binary, quota exhaustion, transient SDK errors, max-turns blowups…)
      # should not turn the PR's check red. `continue-on-error: true`
      # leaves a visible warning on the step and keeps the job green.
      # Plumbing steps above stay strict on purpose: those failures point
      # to bugs in this workflow, not to Claude misbehaving.
      - uses: anthropics/claude-code-action@v1
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.body }}
          claude_args: ${{ steps.args.outputs.value }}
          use_sticky_comment: true
          show_full_output: ${{ inputs.show_full_output }}
