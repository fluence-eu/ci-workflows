name: Ruby Gem — GitHub Release

on:
  workflow_call:
    inputs:
      tag:
        description: Tag to release (e.g. v0.12.0)
        required: true
        type: string
      gem_name:
        description: Gem name forwarded to the publish workflow
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Get version from tag
        id: tag
        run: |
          TAG=${{ inputs.tag }}
          VERSION=${TAG#v}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract changelog for version
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          awk "/^## \[$VERSION\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > release-notes.md

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.tag.outputs.tag }} \
            --title "${{ steps.tag.outputs.tag }}" \
            --notes-file release-notes.md

  publish:
    needs: release
    uses: fluence-eu/ci-workflows/.github/workflows/ruby-gem-publish.yml@main
    with:
      tag: ${{ needs.release.outputs.tag }}
      gem_name: ${{ inputs.gem_name }}
    secrets: inherit
    permissions:
      contents: write
      packages: write
