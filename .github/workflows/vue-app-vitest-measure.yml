name: Vue App — Vitest Measure

# Runs vitest --reporter=json, uploads the test report as
# `vitest-report`. Exposes the step's outcome as a job output.

on:
  workflow_call:
    outputs:
      vitest_outcome:
        description: Outcome of the vitest step.
        value: ${{ jobs.measure.outputs.vitest_outcome }}
    secrets:
      NPMRC_AUTH:
        description: |
          Multi-line .npmrc content (one or more `//host/:_authToken=…` lines) appended verbatim to `~/.npmrc` before `npm ci`. Supports any number of private registries.
        required: false

permissions:
  contents: read
  packages: read

jobs:
  measure:
    name: Measure
    runs-on: ubuntu-latest
    outputs:
      vitest_outcome: ${{ steps.vitest.outcome }}
    steps:
      - uses: actions/checkout@v6

      - name: Read .fluence-ci.yml
        id: cfg
        uses: fluence-eu/ci-workflows/actions/read-config@v6
        with:
          keys: |
            node_version=node_version=20
            pre_install_command=pre_install_command=
            test_command=vitest.test_command=npx --no-install vitest run --reporter=json --outputFile=tmp/fluence-report/vitest.json

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ fromJSON(steps.cfg.outputs.values).node_version }}
          cache: 'npm'

      - name: Pre-install setup
        if: fromJSON(steps.cfg.outputs.values).pre_install_command != ''
        run: ${{ fromJSON(steps.cfg.outputs.values).pre_install_command }}

      - name: Configure private npm registries
        if: env.NPMRC_AUTH != ''
        env:
          NPMRC_AUTH: ${{ secrets.NPMRC_AUTH }}
        run: printf '%s\n' "$NPMRC_AUTH" >> "$HOME/.npmrc"

      - run: npm ci

      - name: Run vitest
        id: vitest
        continue-on-error: true
        run: |
          mkdir -p tmp/fluence-report
          ${{ fromJSON(steps.cfg.outputs.values).test_command }}

      - name: Upload vitest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-report
          path: tmp/fluence-report/vitest.json
          if-no-files-found: warn
