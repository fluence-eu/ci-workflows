name: Vue App — Prettier Measure

# Runs prettier --check, captures stdout (the list of unformatted
# files) to prettier.txt, and uploads it as `prettier-report`.

on:
  workflow_call:
    outputs:
      prettier_outcome:
        description: Outcome of the prettier step.
        value: ${{ jobs.measure.outputs.prettier_outcome }}
    secrets:
      NPMRC_AUTH:
        description: |
          Multi-line .npmrc content (one or more `//host/:_authToken=…` lines) appended verbatim to `~/.npmrc` before `npm ci`. Supports any number of private registries.
        required: false

permissions:
  contents: read
  packages: read

jobs:
  measure:
    name: Measure
    runs-on: ubuntu-latest
    outputs:
      prettier_outcome: ${{ steps.prettier.outcome }}
    steps:
      - uses: actions/checkout@v6

      - name: Read .fluence-ci.yml
        id: cfg
        uses: fluence-eu/ci-workflows/actions/read-config@v6
        with:
          keys: |
            node_version=node_version=
            pre_install_command=pre_install_command=
            format_command=prettier.format_command=npx --no-install prettier --check .

      - name: Resolve Node version
        id: node
        uses: fluence-eu/ci-workflows/actions/resolve-version@v6
        with:
          config_version: ${{ fromJSON(steps.cfg.outputs.values).node_version }}
          file: .nvmrc
          default: '20'

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'

      - name: Pre-install setup
        if: fromJSON(steps.cfg.outputs.values).pre_install_command != ''
        run: ${{ fromJSON(steps.cfg.outputs.values).pre_install_command }}

      - name: Configure private npm registries
        if: env.NPMRC_AUTH != ''
        env:
          NPMRC_AUTH: ${{ secrets.NPMRC_AUTH }}
        run: printf '%s\n' "$NPMRC_AUTH" >> "$HOME/.npmrc"

      - run: npm ci

      - name: Run prettier
        id: prettier
        continue-on-error: true
        run: |
          mkdir -p tmp/fluence-report
          ${{ fromJSON(steps.cfg.outputs.values).format_command }} 2>&1 | tee tmp/fluence-report/prettier.txt
          exit ${PIPESTATUS[0]}

      - name: Upload prettier report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prettier-report
          path: tmp/fluence-report/prettier.txt
          if-no-files-found: warn
