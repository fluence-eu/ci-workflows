name: Vue App — Prettier Measure

# Runs prettier --check, captures stdout (the list of unformatted
# files) to prettier.txt, and uploads it as `prettier-report`.

on:
  workflow_call:
    inputs:
      node_version:
        description: Node version for the runner
        required: false
        type: string
        default: '20'
      pre_install_command:
        description: Optional shell command run between setup-node and npm ci (e.g. to configure a private npm registry).
        required: false
        type: string
        default: ''
      npm_registry_host:
        description: |
          Host of a private npm registry to authenticate against (e.g. `npm.fontawesome.com`). When set together with the `NPM_REGISTRY_TOKEN` secret, the runner writes `npm config set "//<host>/:_authToken=$NPM_REGISTRY_TOKEN"` before `npm ci`.
        required: false
        type: string
        default: ''
      format_command:
        description: Shell command running prettier --check. stdout captured to tmp/fluence-report/prettier.txt.
        required: false
        type: string
        default: 'npx --no-install prettier --check .'
    outputs:
      prettier_outcome:
        description: Outcome of the prettier step.
        value: ${{ jobs.measure.outputs.prettier_outcome }}
    secrets:
      NPM_REGISTRY_TOKEN:
        description: Token paired with `npm_registry_host` for private npm registry auth.
        required: false

permissions:
  contents: read
  packages: read

jobs:
  measure:
    name: Measure
    runs-on: ubuntu-latest
    outputs:
      prettier_outcome: ${{ steps.prettier.outcome }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'

      - name: Pre-install setup
        if: inputs.pre_install_command != ''
        run: ${{ inputs.pre_install_command }}

      - name: Configure private npm registry
        if: inputs.npm_registry_host != ''
        env:
          NPM_REGISTRY_HOST: ${{ inputs.npm_registry_host }}
          NPM_REGISTRY_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}
        run: npm config set "//${NPM_REGISTRY_HOST}/:_authToken=${NPM_REGISTRY_TOKEN}"

      - run: npm ci

      - name: Run prettier
        id: prettier
        continue-on-error: true
        run: |
          mkdir -p tmp/fluence-report
          ${{ inputs.format_command }} 2>&1 | tee tmp/fluence-report/prettier.txt
          exit ${PIPESTATUS[0]}

      - name: Upload prettier report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prettier-report
          path: tmp/fluence-report/prettier.txt
          if-no-files-found: warn
