name: Ruby Gem — Code Quality PR Check

# Runs on pull requests. Delegates the PR-head measurement to
# ruby-gem-codequality-measure.yml (same reusable used by main-push
# baseline runs — zero duplication). Then fetches the latest baseline
# from a main-push `codequality-measure.yml` run, posts a sticky PR
# comment with the before/after diff (new reek smells via
# (source, context, smell_type) tuple, flog and flay score deltas).
#
# **Advisory mode**: the workflow does NOT fail on findings. Reek /
# flog / flay are intentionally treated as informational metrics —
# devs see trends and decide what to fix. For a strict lint gate, use
# ruby-gem-rubocop-pr.yml in addition.
#
# Same baseline pattern as ruby-gem-{docs,coverage,rubocop}-pr.yml.

on:
  workflow_call:
    inputs:
      ruby_version:
        description: Ruby version for the runner.
        required: false
        type: string
        default: '4.0'
      paths:
        description: |
          Optional space-separated source paths to scan, forwarded as
          `--paths "..."` to `fluence-ci codequality`. When empty,
          Steps#codequality auto-detects (`app lib` for Rails, `lib`
          for plain gems). Useful for monorepos / non-standard layouts.
        required: false
        type: string
        default: ''
      measure_workflow_file:
        description: Consumer workflow filename that uploaded the `codequality-report` artifact on the base branch (used to find the baseline).
        required: false
        type: string
        default: 'codequality-measure.yml'
    secrets:
      FLUENCE_CI_BOT_PRIVATE_KEY:
        description: Optional GitHub App private key used to author the sticky PR comment. When omitted, the comment is posted as `github-actions[bot]` via the default `GITHUB_TOKEN`.
        required: false
      FLUENCE_RELEASE_BOT_PRIVATE_KEY:
        description: |
          Optional release App private key. When forwarded, release PRs
          (head_ref `release/v*` authored by the App) skip both measure
          and comment jobs — skipped jobs report as `neutral` and count
          as passing for required status checks, letting auto-merge
          proceed. When omitted, all PRs run normally.
        required: false

permissions:
  contents: read
  packages: read

jobs:
  resolve-bot:
    name: Resolve release-bot
    runs-on: ubuntu-latest
    outputs:
      skip_release_pr: ${{ steps.check.outputs.skip }}
    steps:
      - id: token
        uses: fluence-eu/ci-workflows/actions/release-app-token@v3
        with:
          client-id: ${{ vars.FLUENCE_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLUENCE_RELEASE_BOT_PRIVATE_KEY }}
      - id: check
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          SLUG: ${{ steps.token.outputs.app-slug }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Skip when both conditions hold: PR author is the release App
          # AND head ref starts with `release/v`. SLUG is empty when the
          # consumer didn't forward FLUENCE_RELEASE_BOT_PRIVATE_KEY — the empty
          # match makes skip false, preserving the prior always-run
          # behaviour.
          if [ -n "$SLUG" ] && [ "$AUTHOR" = "${SLUG}[bot]" ] && [[ "$HEAD_REF" == release/v* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release PR detected — skipping measure + comment."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  measure:
    name: Measure
    needs: resolve-bot
    if: needs.resolve-bot.outputs.skip_release_pr == 'false'
    uses: fluence-eu/ci-workflows/.github/workflows/ruby-gem-codequality-measure.yml@v3
    with:
      ruby_version: ${{ inputs.ruby_version }}
      paths:        ${{ inputs.paths }}

  comment:
    name: Comment on PR
    needs: [resolve-bot, measure]
    if: needs.resolve-bot.outputs.skip_release_pr == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download PR codequality report
        uses: actions/download-artifact@v8
        with:
          name: codequality-report
          path: codequality-pr/

      - name: Find latest base-branch run with codequality report
        id: base-run
        uses: fluence-eu/ci-workflows/actions/find-base-run@v3
        with:
          workflow_file: ${{ inputs.measure_workflow_file }}

      - name: Download base codequality report
        if: steps.base-run.outputs.id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: codequality-report
          run-id: ${{ steps.base-run.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: codequality-base/

      - name: Resolve baseline paths
        id: base
        run: |
          if [ -f codequality-base/reek.json ]; then
            echo "reek=codequality-base/reek.json" >> "$GITHUB_OUTPUT"
          fi
          if [ -f codequality-base/flog.txt ]; then
            echo "flog=codequality-base/flog.txt" >> "$GITHUB_OUTPUT"
          fi
          if [ -f codequality-base/flay.txt ]; then
            echo "flay=codequality-base/flay.txt" >> "$GITHUB_OUTPUT"
          fi

      - uses: ruby/setup-ruby@v1
        env:
          # Authenticate `bundle install` (triggered by bundler-cache: true)
          # against GitHub Packages so private Fluence gems (e.g.
          # fluence-ci-tools) can be fetched. The job declares
          # `permissions: packages: read` to grant the GITHUB_TOKEN the
          # required scope; the env var hands it to Bundler.
          BUNDLE_RUBYGEMS__PKG__GITHUB__COM: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler-cache: true

      - id: body
        uses: fluence-eu/ci-workflows/actions/codequality-report@v3
        with:
          reek_path:      codequality-pr/reek.json
          flog_path:      codequality-pr/flog.txt
          flay_path:      codequality-pr/flay.txt
          base_reek_path: ${{ steps.base.outputs.reek }}
          base_flog_path: ${{ steps.base.outputs.flog }}
          base_flay_path: ${{ steps.base.outputs.flay }}

      - uses: fluence-eu/ci-workflows/actions/post-sticky-comment@v3
        with:
          marker:          '<!-- codequality-report -->'
          body:            ${{ steps.body.outputs.body }}
          client-id:       ${{ vars.FLUENCE_CI_CLIENT_ID }}
          app-private-key: ${{ secrets.FLUENCE_CI_BOT_PRIVATE_KEY }}
