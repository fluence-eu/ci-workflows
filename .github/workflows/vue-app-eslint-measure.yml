name: Vue App — ESLint Measure

# Runs eslint with --format json and uploads the offense report as
# `eslint-report`. Exposes the eslint step's outcome as a job output.
#
# Called from two places:
# - the consumer's `eslint-measure.yml` on push to the default branch,
#   to produce the baseline artifact used by vue-app-eslint-pr.yml,
# - vue-app-eslint-pr.yml on pull_request, to measure the PR head
#   (no duplication: same reusable, same behaviour).

on:
  workflow_call:
    outputs:
      eslint_outcome:
        description: Outcome of `eslint` (`success` / `failure`).
        value: ${{ jobs.measure.outputs.eslint_outcome }}
    secrets:
      NPMRC_AUTH:
        description: |
          Multi-line .npmrc content (one or more `//host/:_authToken=…` lines) appended verbatim to `~/.npmrc` before `npm ci`. Supports any number of private registries.
        required: false

permissions:
  contents: read
  packages: read

jobs:
  measure:
    name: Measure
    runs-on: ubuntu-latest
    outputs:
      eslint_outcome: ${{ steps.eslint.outcome }}
    steps:
      - uses: actions/checkout@v6

      - name: Read .fluence-ci.yml
        id: cfg
        uses: fluence-eu/ci-workflows/actions/read-config@v6
        with:
          keys: |
            node_version=node_version=
            pre_install_command=pre_install_command=
            lint_command=eslint.lint_command=npx --no-install eslint . --format json --output-file tmp/fluence-report/eslint.json

      - name: Resolve Node version
        id: node
        uses: fluence-eu/ci-workflows/actions/resolve-version@v6
        with:
          config_version: ${{ fromJSON(steps.cfg.outputs.values).node_version }}
          file: .nvmrc
          default: '20'

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'

      - name: Pre-install setup
        if: fromJSON(steps.cfg.outputs.values).pre_install_command != ''
        run: ${{ fromJSON(steps.cfg.outputs.values).pre_install_command }}

      - name: Configure private npm registries
        if: env.NPMRC_AUTH != ''
        env:
          NPMRC_AUTH: ${{ secrets.NPMRC_AUTH }}
        run: printf '%s\n' "$NPMRC_AUTH" >> "$HOME/.npmrc"

      - run: npm ci

      - name: Run eslint
        id: eslint
        continue-on-error: true
        run: |
          mkdir -p tmp/fluence-report
          ${{ fromJSON(steps.cfg.outputs.values).lint_command }}

      - name: Upload eslint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eslint-report
          path: tmp/fluence-report/eslint.json
          if-no-files-found: warn
