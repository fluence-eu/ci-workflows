name: Ruby Gem — RuboCop Measure

# Runs rubocop with --format json and uploads the offense report as
# `rubocop-report`. Exposes the rubocop step's outcome as a job output.
#
# Called from two places:
# - the consumer's `rubocop-measure.yml` on push to main, to produce
#   the baseline artifact used by ruby-gem-rubocop-pr.yml,
# - ruby-gem-rubocop-pr.yml on pull_request, to measure the PR head
#   (no duplication: same reusable, same behaviour).
#
# `rubocop` runs with `continue-on-error: true`: a failure does not
# abort the upload. The PR workflow consumes the rubocop_outcome
# output to decide whether to fail the run (after posting the sticky
# comment). The main-push invocation does not gate on the outcome —
# enforcement is PR-side, main cannot drift without a PR having
# previously been merged that shouldn't have passed.

on:
  workflow_call:
    outputs:
      rubocop_outcome:
        description: Outcome of `rubocop` (`success` / `failure`).
        value: ${{ jobs.measure.outputs.rubocop_outcome }}

permissions:
  contents: read
  packages: read

jobs:
  measure:
    name: Measure
    runs-on: ubuntu-latest
    outputs:
      rubocop_outcome: ${{ steps.rubocop.outcome }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve Ruby version
        id: ruby
        uses: fluence-eu/ci-workflows/actions/resolve-version@v6
        with:
          runtime: ruby

      - uses: ruby/setup-ruby@v1
        env:
          # Authenticate `bundle install` (triggered by bundler-cache: true)
          # against GitHub Packages so private Fluence gems (e.g.
          # guardian-ci) can be fetched. The job declares
          # `permissions: packages: read` to grant the GITHUB_TOKEN the
          # required scope; the env var hands it to Bundler.
          BUNDLE_RUBYGEMS__PKG__GITHUB__COM: x-access-token:${{ secrets.GITHUB_TOKEN }}
        with:
          ruby-version: ${{ steps.ruby.outputs.version }}
          bundler-cache: true

      - name: Cache rubocop analysis
        uses: actions/cache@v6
        with:
          path: tmp/rubocop
          # The cache must vary with anything that affects the binary
          # parser output: Ruby runtime (the resolved version — the same
          # value setup-ruby ran with), bundled rubocop version
          # (Gemfile.lock for apps, gemspec for gems — hashFiles silently
          # ignores missing files), and rubocop config.
          # restore-keys keeps the same Ruby-version prefix so a fallback
          # never crosses runtimes.
          key: rubocop-${{ runner.os }}-${{ steps.ruby.outputs.version }}-${{ hashFiles('**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock', '*.gemspec') }}
          restore-keys: rubocop-${{ runner.os }}-${{ steps.ruby.outputs.version }}-

      # Invokes the gem's `lint --report` command (not `bundle exec
      # rubocop` directly) so the catalog defined in
      # `Guardian::Ci::Steps#lint` is the single source of truth.
      # The same `bundle exec guardian-ci lint --report` runs locally
      # via the consumer's `bin/guardian-ci`, guaranteeing zero drift
      # between dev pre-push and CI.
      - name: Run rubocop (via guardian-ci)
        id: rubocop
        continue-on-error: true
        env:
          RUBOCOP_CACHE_ROOT: tmp/rubocop
        run: bundle exec guardian-ci lint --report

      - name: Upload rubocop report
        uses: actions/upload-artifact@v7
        with:
          name: rubocop-report
          path: tmp/guardian-report/rubocop.json
