name: Bump Ruby gem versions
description: |
  Computes the next version (patch|minor|major) from the current shared
  version of one or more gems, or takes the one given in `version`, then
  writes it back to each `version.rb`.
  The read-and-verify-sync step is delegated to the
  `read-and-verify-ruby-gem-versions` composite so that the same logic
  serves both prepare-release (this composite, with a write) and
  release-time (the read composite alone).

  Each entry in `gem-specs` is either a gem name (e.g. `fluence-foo`)
  for which the version file is auto-derived via the Bundler convention
  `lib/<gem-name-with-dashes-as-slashes>/version.rb`, or
  `gem-name:path/to/version.rb` to override the path explicitly.

  Consumed by `ruby-gem-prepare-release.yml` reusable workflow.
  Symmetric with `actions/bump-npm-package-versions` for the npm family.

inputs:
  bump:
    description: "Version bump type (patch|minor|major). Ignored when `version` is set."
    required: false
    default: ''
  version:
    description: "New version written as is (no v prefix), instead of one computed from `bump`."
    required: false
    default: ''
  gem-specs:
    description: 'Newline-separated list of gem names (without .gemspec). Optional ":path/to/version.rb" override per line.'
    required: true

outputs:
  version:
    description: "The new version (no v prefix)."
    value: ${{ steps.write.outputs.version }}
  tag:
    description: "The new tag (v-prefixed version)."
    value: ${{ steps.write.outputs.tag }}
  version_files:
    description: "Newline-separated list of version.rb paths actually written to. Useful to git-add downstream without re-deriving from gem-specs."
    value: ${{ steps.write.outputs.version_files }}

runs:
  using: composite
  steps:
    - id: read
      uses: fluence-eu/ci-workflows/actions/read-and-verify-ruby-gem-versions@v5
      with:
        gem-specs: ${{ inputs.gem-specs }}

    - id: write
      shell: bash
      env:
        BUMP: ${{ inputs.bump }}
        NEW_VERSION: ${{ inputs.version }}
        GEM_SPECS: ${{ inputs.gem-specs }}
        CURRENT: ${{ steps.read.outputs.version }}
      run: |
        set -euo pipefail

        # Compute the new version from the shared current, unless given.
        if [ -z "$NEW_VERSION" ]; then
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$BUMP" in
            patch) PATCH=$((PATCH + 1)) ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            *) echo "::error::Invalid bump type '$BUMP'. Use patch, minor, or major." ; exit 1 ;;
          esac
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
        fi
        echo "Bumping from ${CURRENT} → ${NEW_VERSION}"

        # Derive each version file from the gem-specs entry (`:override`
        # syntax wins; otherwise Bundler convention).
        declare -a FILES=()
        while IFS= read -r line; do
          line="$(echo "$line" | xargs)"
          [ -z "$line" ] && continue
          if [[ "$line" == *:* ]]; then
            VERSION_FILE="${line#*:}"
          else
            VERSION_FILE="lib/$(echo "$line" | tr '-' '/')/version.rb"
          fi
          if [ ! -f "$VERSION_FILE" ]; then
            echo "::error::version file not found: ${VERSION_FILE} (derived for ${line%%:*})"
            exit 1
          fi
          sed -i.bak "s/VERSION = '${CURRENT}'/VERSION = '${NEW_VERSION}'/" "$VERSION_FILE"
          rm -f "${VERSION_FILE}.bak"
          if ! grep -q "VERSION = '${NEW_VERSION}'" "$VERSION_FILE"; then
            echo "::error::Version bump did not apply to ${VERSION_FILE}"
            exit 1
          fi
          FILES+=("$VERSION_FILE")
        done <<< "$GEM_SPECS"

        echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
        echo "tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"
        # Persist resolved version file list for downstream consumers.
        {
          echo 'version_files<<EOF'
          printf '%s\n' "${FILES[@]}"
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"
