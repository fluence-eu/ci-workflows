name: Bump npm package versions
description: |
  Computes the next version (patch|minor|major) from the current shared
  version of one or more `package.json` files, then writes it back.
  The read-and-verify-sync step is delegated to the
  `read-and-verify-npm-versions` composite so that the same logic
  serves both prepare-release (this composite, with a write) and
  release-time (the read composite alone).

  Optional `cross-pin-dependency`: when set to a package name, that
  dependency is also pinned to the new version in every `package.json`
  that declares it (handles tightly-coupled monorepo siblings, e.g. a
  UI package importing an `@internal` API from another package in the
  same repo).

  Consumed by `npm-prepare-release.yml` reusable workflow. Symmetric
  with `actions/bump-ruby-gem-versions` for the `ruby-gem-*` family.

inputs:
  bump:
    description: "Version bump type (patch|minor|major)"
    required: true
  package-paths:
    description: "Newline-separated list of package.json paths."
    required: true
  cross-pin-dependency:
    description: "Optional npm package name to pin to the new version in every package_paths entry that declares it. Empty = no cross-pin."
    required: false
    default: ""

outputs:
  version:
    description: "The new version (semver, no v prefix)."
    value: ${{ steps.write.outputs.version }}
  tag:
    description: "The new tag (v-prefixed semver)."
    value: ${{ steps.write.outputs.tag }}

runs:
  using: composite
  steps:
    - id: read
      uses: fluence-eu/ci-workflows/actions/read-and-verify-npm-versions@v5
      with:
        package-paths: ${{ inputs.package-paths }}

    - id: write
      shell: bash
      env:
        BUMP: ${{ inputs.bump }}
        PACKAGE_PATHS: ${{ inputs.package-paths }}
        CROSS_PIN: ${{ inputs.cross-pin-dependency }}
        CURRENT: ${{ steps.read.outputs.version }}
      run: |
        set -euo pipefail

        # Compute the new version from the shared current.
        IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
        case "$BUMP" in
          patch) PATCH=$((PATCH + 1)) ;;
          minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
          major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
          *) echo "::error::Invalid bump type '$BUMP'. Use patch, minor, or major." ; exit 1 ;;
        esac
        NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
        echo "Bumping from ${CURRENT} → ${NEW_VERSION}"

        # Write the new version (and optional cross-pin) into every package.
        while IFS= read -r pkg; do
          pkg="$(echo "$pkg" | xargs)"
          [ -z "$pkg" ] && continue
          node -e "
            const fs = require('fs');
            const path = process.argv[1];
            const version = process.argv[2];
            const crossPin = process.argv[3];
            const json = JSON.parse(fs.readFileSync(path, 'utf-8'));
            json.version = version;
            if (crossPin && json.dependencies && json.dependencies[crossPin]) {
              json.dependencies[crossPin] = version;
            }
            fs.writeFileSync(path, JSON.stringify(json, null, 2) + '\n');
          " "$pkg" "$NEW_VERSION" "$CROSS_PIN"
        done <<< "$PACKAGE_PATHS"

        echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
        echo "tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"
