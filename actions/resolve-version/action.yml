name: Resolve version from config or file
description: >
  Resolves the runtime version with the precedence `.fluence-ci.yml` value >
  version file > default. `runtime: node` reads the `node_version` key then
  `.node-version`, then `.nvmrc`, falling back to '24'; `runtime: ruby` reads
  `ruby_version` then `.ruby-version`, falling back to '4.0'. Must run after
  the consumer checkout so the config and version files are on the runner.

inputs:
  runtime:
    description: Runtime to resolve (`node` or `ruby`).
    required: true
  default:
    description: >
      Replaces the runtime's built-in fallback when neither the config key
      nor the version file provides a value. The `npm-*` family passes '22'
      to keep its historical default, which differs from the `vue-app-*` '24'.
    required: false
    default: ''

outputs:
  version:
    description: The resolved version.
    value: ${{ steps.resolve.outputs.version }}

runs:
  using: composite
  steps:
    - id: cfg
      uses: fluence-eu/ci-workflows/actions/read-config@v7
      with:
        keys: version=${{ inputs.runtime }}_version=
    - id: resolve
      shell: bash
      env:
        RUNTIME: ${{ inputs.runtime }}
        CONFIG_VERSION: ${{ fromJSON(steps.cfg.outputs.values).version }}
        DEFAULT_OVERRIDE: ${{ inputs.default }}
      run: |
        # Node ships two spellings of the same pin: `.node-version` (nodenv,
        # asdf, Volta) and `.nvmrc` (nvm, fnm). Both are read, first match
        # wins, so a repo carrying both stays consistent with the tools its
        # contributors actually run.
        case "$RUNTIME" in
          node) files=".node-version .nvmrc" default=24 ;;
          ruby) files=".ruby-version" default=4.0 ;;
          *) echo "::error::unknown runtime '$RUNTIME'"; exit 1 ;;
        esac
        default="${DEFAULT_OVERRIDE:-$default}"
        version="$CONFIG_VERSION"
        if [ -z "$version" ]; then
          for file in $files; do
            if [ -f "$file" ]; then version=$(cat "$file"); break; fi
          done
        fi
        echo "version=${version:-$default}" >> "$GITHUB_OUTPUT"
