name: ESLint Report
description: Render a sticky-comment Markdown body comparing the PR's eslint findings against the baseline.

inputs:
  outcome:
    description: Outcome of the `eslint` step (`success` / `failure`).
    required: true
  base_ref:
    description: Git base ref (e.g. `origin/develop`) used for the changed-files diff.
    required: true
  pr_path:
    description: Path to the PR's eslint report.
    required: false
    default: ''
  base_path:
    description: Path to the baseline eslint report, or empty when no baseline is available.
    required: false
    default: ''

outputs:
  body:
    description: Markdown body (with sticky-comment marker) ready to post.
    value: ${{ steps.render.outputs.body }}

runs:
  using: composite
  steps:
    - id: render
      shell: bash
      env:
        GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
        OUTCOME: ${{ inputs.outcome }}
        BASE_REF: ${{ inputs.base_ref }}
        PR_PATH: ${{ inputs.pr_path }}
        BASE_PATH: ${{ inputs.base_path }}
      run: |
        BODY="$(ruby "${GITHUB_ACTION_PATH}/eslint_report.rb" \
          "$OUTCOME" "$BASE_REF" "$PR_PATH" "$BASE_PATH")"
        {
          echo "body<<EOF_BODY"
          echo "<!-- eslint-report -->"
          echo "$BODY"
          echo "EOF_BODY"
        } >> "$GITHUB_OUTPUT"
