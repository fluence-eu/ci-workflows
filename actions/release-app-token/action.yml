name: Release App Token
description: |
  Generate a GitHub App installation token from the Fluence release App.
  Centralises the create-github-app-token@v3 invocation that the
  release/prepare-release workflows duplicate.

  Both `client-id` and `private-key` must be passed in by the caller —
  per the GitHub Actions context-availability rules, neither `vars`
  nor `secrets` are accessible inside a composite action. Callers
  forward them via the `with:` block:
    client-id   -> vars.FLUENCE_RELEASE_BOT_CLIENT_ID
    private-key -> secrets.FLUENCE_RELEASE_BOT_PRIVATE_KEY

  When `private-key` is empty (e.g. a consumer that hasn't opted in
  yet), the token-generation step is skipped and the outputs resolve
  to empty strings. Callers can fall back to github.token by using
  the GitHub Actions short-circuit operator on the output.

inputs:
  client-id:
    description: GitHub App Client ID. Pass via `vars.FLUENCE_RELEASE_BOT_CLIENT_ID` from the calling workflow.
    required: true
  private-key:
    description: GitHub App private key (PEM). Pass via `secrets.FLUENCE_RELEASE_BOT_PRIVATE_KEY`. When empty the action no-ops and outputs are empty.
    required: false
    default: ''

outputs:
  token:
    description: Installation token, or empty string if no private key was provided.
    value: ${{ steps.token.outputs.token }}
  app-slug:
    description: Slug of the App that issued the token (e.g. `fluence-release-bot`), or empty string when no token was generated.
    value: ${{ steps.token.outputs.app-slug }}

runs:
  using: composite
  steps:
    - id: token
      if: inputs.private-key != ''
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
